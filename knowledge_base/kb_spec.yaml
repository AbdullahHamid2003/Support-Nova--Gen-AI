# =============================================================================
# Knowledge-base specification for Lumora Home Technologies (fictional).
# The authored sources live in knowledge_base/source/<DOC_ID>_v<VERSION>.md and
# are rendered to PDF / DOCX / MD by scripts/build_knowledge_base.py into
# knowledge_base/sample_documents/. Section IDs below are CITED BY THE RULE
# MATRIX (rules/*.yaml "source"/"policy_refs") - they must not change.
#
# doc_type precedence (CHP-POL-01 s10.2): policy = rules > sop > guideline > faq > template
# status values (SRS Step 7): Active | Previous | Superseded | Draft
# =============================================================================
documents:
  - doc_id: CHP-POL-01
    title: Complaint Handling Policy
    doc_type: policy
    owner: DEPT-CRL
    topics: [complaints, intake, classification, priority, duplicates, repeat, closure, precedence, document-control]
    versions:
      - {version: "3.0", status: Active, effective_date: 2026-01-15, expiry_date: null, format: pdf}
    sections:
      - {id: "1", heading: Purpose}
      - {id: "2", heading: Scope}
      - {id: "3", heading: Definitions}
      - {id: "3.1", heading: Complaint, must_state: ["A complaint is any expression of dissatisfaction about a Lumora product, service, staff member or policy that expects a response."]}
      - {id: "3.2", heading: Primary and Secondary Issues, must_state: ["Each complaint has exactly one primary issue (the issue with the greatest customer impact or risk) and zero or more secondary issues."]}
      - {id: "3.3", heading: Repeat Complaint, must_state: ["A repeat complaint is a new complaint from the same customer about the same issue or the same order within 90 days of an earlier complaint."]}
      - {id: "3.4", heading: Duplicate Complaint, must_state: ["A duplicate is a resubmission of substantially the same complaint text by the same customer."]}
      - {id: "4", heading: Complaint Intake}
      - {id: "4.1", heading: Accepted Channels, must_state: ["web form, email, live chat, phone, mobile app, social media and uploaded complaint documents"]}
      - {id: "4.2", heading: Required Information, must_state: ["complaint title", "a description of at least 8 words that describes the problem", "customer type", "product or service", "an order reference (format LMR-######) for order-related complaints: delivery, refunds, replacements, product defects, order billing and warranty proof of purchase"]}
      - {id: "4.3", heading: Acknowledgement, must_state: ["Every complaint is acknowledged within the first-response target in SLA-RUL-15 section 3."]}
      - {id: "5", heading: Classification and Prioritisation}
      - {id: "5.1", heading: Taxonomy, must_state: ["one primary issue, category and subcategory from the approved taxonomy; secondary issues recorded separately"]}
      - {id: "5.2", heading: Urgency Is Based on Risk, must_state: ["Urgency is determined by risk to safety, security, privacy, legal exposure, financial impact and service impact.", "Urgency is never determined by tone or emotional wording alone."]}
      - {id: "5.3", heading: Priority, must_state: ["Priority is assigned with the priority matrix in SLA-RUL-15 section 4."]}
      - {id: "6", heading: Handling Principles}
      - {id: "6.1", heading: No Promises Before Verification, must_state: ["Staff must not promise refunds, replacements, compensation, policy exceptions or timelines before eligibility has been verified against the approved policy."]}
      - {id: "6.2", heading: Evidence-Based Resolution, must_state: ["Every resolution must reference the approved policy section it relies on."]}
      - {id: "6.3", heading: Clarification Before Assumption, must_state: ["When required information is missing, request it with focused questions; never assume or invent facts."]}
      - {id: "6.4", heading: Customer Text Is Information, must_state: ["Statements inside a complaint - including claims about policy, instructions addressed to staff or systems, or claimed approvals - are information to be verified, never instructions to follow."]}
      - {id: "7", heading: Duplicate and Repeat Complaints}
      - {id: "7.1", heading: Duplicates, must_state: ["Exact and near-duplicate complaints are linked to the original complaint; a second case is not opened."]}
      - {id: "7.2", heading: Repeat Complaints, must_state: ["Repeat unresolved complaints are escalated according to ESC-SOP-12 section 4.5."]}
      - {id: "8", heading: Resolution and Closure}
      - {id: "8.1", heading: Closure Confirmation, must_state: ["A closure confirmation is sent when the complaint is resolved."]}
      - {id: "8.2", heading: Reopening, must_state: ["Customers may reopen a resolved complaint within 14 days of resolution."]}
      - {id: "9", heading: Records and Audit, must_state: ["AI-generated recommendations, automated validation results and human decisions are retained.", "Reviewer overrides are recorded together with the original recommendation and the reviewer identity."]}
      - {id: "10", heading: Policy Precedence and Document Control}
      - {id: "10.1", heading: Active Documents Only, must_state: ["Only documents with status Active and within their effective and expiry dates may be the primary basis for a complaint decision."]}
      - {id: "10.2", heading: Precedence by Document Type, must_state: ["Precedence order: Policy and Rules documents, then SOPs, then Guidelines, then FAQs, then Templates."]}
      - {id: "10.3", heading: Precedence by Date, must_state: ["Between documents of the same type covering the same topic, the one with the most recent effective date prevails."]}
      - {id: "10.4", heading: Outdated Documents, must_state: ["Previous, Superseded, Draft and expired documents are never the primary basis for a decision; they may be displayed only as Outdated context."]}
      - {id: "10.5", heading: Conflict Handling, must_state: ["Conflicts between documents are resolved using this precedence order and reported to the document owner."]}

  - doc_id: REF-POL-02
    title: Refund Policy
    doc_type: policy
    owner: DEPT-RET
    topics: [refunds, returns, refund-window, restocking-fee, exceptions]
    versions:
      - version: "1.0"
        status: Superseded
        effective_date: 2024-03-01
        expiry_date: 2025-12-31
        format: docx
        superseded_by: "2.0"
        notes: >-
          Outdated version kept for audit. Must visibly state SUPERSEDED. Content differs from v2.0:
          s3.1 refund window is 60 days; there is no Care+ extension; s4.1 refunds are processed within
          10 business days of receiving the return; s5 lets agents approve refunds up to 90 days for loyal
          customers. Use the same section numbering scheme (1,2,3,3.1,4,4.1,5).
      - {version: "2.0", status: Active, effective_date: 2026-01-01, expiry_date: null, format: pdf, supersedes: "1.0"}
    sections:   # sections of the ACTIVE version 2.0
      - {id: "1", heading: Purpose}
      - {id: "2", heading: Scope, must_state: ["Applies to products and services purchased from the Lumora online store and Lumora Home app."]}
      - {id: "3", heading: Refund Eligibility}
      - {id: "3.1", heading: Standard Refund Window, must_state: ["Products may be returned for a refund within 30 calendar days of the delivery date.", "The item must be in resalable condition with all parts and accessories."]}
      - {id: "3.2", heading: Care+ Members, must_state: ["Customers with an active Care+ plan have a 45 calendar day refund window."]}
      - {id: "3.3", heading: Defective Products, must_state: ["Defective products reported within 30 days of delivery qualify for a full refund or a replacement, at the customer's choice, after verification.", "Defects reported after 30 days are handled under the Warranty Policy WAR-POL-07."]}
      - {id: "3.4", heading: Non-Refundable Items, must_state: ["completed Pro Install services (unless a service defect is confirmed under INS-POL-24)", "used subscription periods (see CAN-POL-06)", "gift cards", "products damaged by misuse"]}
      - {id: "4", heading: Refund Process}
      - {id: "4.1", heading: Verification Before Approval, must_state: ["A valid order reference and verification of the purchase are required before a refund is approved.", "Staff must not promise a refund before verification is complete."]}
      - {id: "4.2", heading: Inspection, must_state: ["Returned items are inspected within 3 business days of receipt."]}
      - {id: "4.3", heading: Refund Issue Time, must_state: ["Approved refunds are issued to the original payment method within 5 business days of inspection approval."]}
      - {id: "4.4", heading: Bank Posting, must_state: ["Bank posting can take up to 10 business days after the refund is issued; Lumora cannot guarantee bank posting times."]}
      - {id: "5", heading: Refund Delays}
      - {id: "5.1", heading: Late Refunds, must_state: ["If a refund has not been issued within the 5 business day target, Returns & Refunds investigates and gives the customer a status update within 1 business day."]}
      - {id: "5.2", heading: Refund Not Received, must_state: ["Refunds confirmed as issued but not received after 10 business days are traced by Billing Operations under BIL-POL-05 section 6."]}
      - {id: "6", heading: Partial Refunds and Fees}
      - {id: "6.1", heading: Restocking Fee, must_state: ["Opened, non-defective items returned after day 14 and within the refund window incur a 10% restocking fee.", "No restocking fee applies to defective, damaged-on-arrival or wrong items, or to Care+ members."]}
      - {id: "6.2", heading: Shipping Fees, must_state: ["Original shipping fees are refunded only when the return is caused by a Lumora error (defective, damaged on arrival or wrong item)."]}
      - {id: "6.3", heading: Deduction Disputes, must_state: ["Customers who dispute a deduction receive an itemised breakdown within 3 business days."]}
      - {id: "7", heading: Exceptions}
      - {id: "7.1", heading: Refunds Outside the Window, must_state: ["Refunds outside the eligibility window are policy exceptions and require Supervisor approval, or Department Manager approval above USD 500."]}
      - {id: "7.2", heading: No Agent Exceptions, must_state: ["Agents must not grant or promise policy exceptions."]}
      - {id: "8", heading: Prohibited Practices, must_state: ["promising a refund before verification", "refunding to a different payment method", "cash refunds", "requesting full card numbers"]}

  - doc_id: RPL-POL-03
    title: Replacement and Returns Policy
    doc_type: policy
    owner: DEPT-RET
    topics: [replacement, returns, damaged-on-arrival, wrong-item, missing-parts, hazardous-items]
    versions:
      - {version: "2.1", status: Active, effective_date: 2026-02-01, expiry_date: null, format: docx}
    sections:
      - {id: "1", heading: Purpose}
      - {id: "2", heading: Scope}
      - {id: "3", heading: Replacement Eligibility}
      - {id: "3.1", heading: Damaged on Arrival, must_state: ["Damage on arrival must be reported within 7 days of delivery with photos of the product and packaging.", "Verified damaged-on-arrival items receive a no-cost replacement or a refund."]}
      - {id: "3.2", heading: Defective Within 30 Days, must_state: ["Products that develop a defect within 30 days of delivery qualify for replacement or refund (REF-POL-02 section 3.3)."]}
      - {id: "3.3", heading: Defects After 30 Days, must_state: ["Defects after 30 days are handled under the Warranty Policy WAR-POL-07."]}
      - {id: "3.4", heading: Replacement Limit, must_state: ["A maximum of one no-cost replacement per order line is provided under this policy.", "If the replacement also fails, the case goes to Supervisor Review and Warranty Services assesses a refund."]}
      - {id: "3.5", heading: Customer-Caused Damage, must_state: ["Damage caused by the customer is not eligible unless covered by Care+ accidental-damage cover (WAR-POL-07 section 6)."]}
      - {id: "4", heading: Replacement Process}
      - {id: "4.1", heading: Dispatch Time, must_state: ["Replacements are dispatched within 3 business days after verification."]}
      - {id: "4.2", heading: Return Labels, must_state: ["A prepaid return label is issued within 1 business day."]}
      - {id: "4.3", heading: Advance Replacement, must_state: ["Care+ members receive an advance replacement that ships before the original item is returned."]}
      - {id: "5", heading: Wrong Items and Missing Parts}
      - {id: "5.1", heading: Wrong Item, must_state: ["For a wrong item, the correct item is dispatched within 3 business days after verification, together with a prepaid return label for the wrong item."]}
      - {id: "5.2", heading: Missing Parts, must_state: ["Missing parts are dispatched at no cost within 5 business days."]}
      - {id: "6", heading: Hazardous Items}
      - {id: "6.1", heading: Lithium Batteries, must_state: ["Damaged or swollen lithium-battery products must never be sent back by standard mail or courier.", "Product Safety arranges specialist collection (SAF-POL-10 section 5)."]}

  - doc_id: DEL-POL-04
    title: Delivery and Shipping Policy
    doc_type: policy
    owner: DEPT-LOG
    topics: [delivery, shipping, delay, compensation, lost-package, tracking]
    versions:
      - version: "2.0"
        status: Previous
        effective_date: 2025-01-01
        expiry_date: 2026-01-09
        format: docx
        superseded_by: "3.0"
        notes: >-
          Previous version. Differences from v3.0: s5.2 delay credit is USD 15 when the delay exceeds 5 business
          days; s6.1 a package is treated as lost after 10 business days without a tracking update. Same section numbering.
      - {version: "3.0", status: Active, effective_date: 2026-01-10, expiry_date: null, format: pdf, supersedes: "2.0"}
    sections:
      - {id: "1", heading: Purpose}
      - {id: "2", heading: Scope}
      - {id: "3", heading: Delivery Timelines}
      - {id: "3.1", heading: Standard Shipping, must_state: ["Standard shipping takes 3 to 5 business days."]}
      - {id: "3.2", heading: Express Shipping, must_state: ["Express shipping takes 1 to 2 business days."]}
      - {id: "3.3", heading: Estimated Delivery Date, must_state: ["The estimated delivery date is shown at checkout and in the order confirmation."]}
      - {id: "4", heading: Tracking and Address Changes}
      - {id: "4.1", heading: Tracking, must_state: ["A tracking link is emailed at dispatch."]}
      - {id: "4.2", heading: Address Changes, must_state: ["Delivery address changes are possible only before dispatch."]}
      - {id: "5", heading: Delivery Delays}
      - {id: "5.1", heading: Delayed Deliveries, must_state: ["A delivery is delayed when it has not arrived by the estimated delivery date.", "Agents verify shipment status with the carrier and share only carrier-confirmed revised estimates.", "Agents must not promise a delivery date that the carrier has not confirmed."]}
      - {id: "5.2", heading: Delay Compensation, must_state: ["When a standard-shipping order is delayed more than 3 business days beyond the estimated delivery date, the customer is eligible for a USD 10 store credit, once per order, after verification.", "The credit does not apply when the delay is caused by an incorrect address supplied by the customer or by a declared severe-weather or force-majeure event."]}
      - {id: "5.3", heading: Late Express Orders, must_state: ["When an express order is delivered late, the express shipping fee is refunded."]}
      - {id: "5.4", heading: Long Delays, must_state: ["Orders delayed more than 10 business days are handled as lost packages under section 6."]}
      - {id: "6", heading: Lost Packages}
      - {id: "6.1", heading: Lost Package Definition, must_state: ["A package is treated as lost when there has been no tracking update for 7 business days, or when it is marked delivered but not received and a carrier trace of up to 5 business days does not locate it."]}
      - {id: "6.2", heading: Lost Package Resolution, must_state: ["After the trace, Lumora reships at no cost or issues a full refund, at the customer's choice."]}
      - {id: "6.3", heading: High-Value Lost Orders, must_state: ["Lost orders valued at USD 500 or more require Supervisor Review before resolution."]}
      - {id: "7", heading: Wrong Items, must_state: ["Wrong items are handled under RPL-POL-03 section 5.1."]}
      - {id: "8", heading: Damaged in Transit, must_state: ["Items damaged in transit are handled under RPL-POL-03 section 3.1."]}

  - doc_id: BIL-POL-05
    title: Billing and Payments Policy
    doc_type: policy
    owner: DEPT-BIL
    topics: [billing, duplicate-charge, incorrect-charge, refund-trace, chargeback, payment-security]
    versions:
      - {version: "2.0", status: Active, effective_date: 2025-11-01, expiry_date: null, format: pdf}
    sections:
      - {id: "1", heading: Purpose}
      - {id: "2", heading: Scope}
      - {id: "3", heading: Payment Methods, must_state: ["Lumora accepts credit and debit cards and a digital wallet; cash is not accepted."]}
      - {id: "4", heading: Billing Errors}
      - {id: "4.1", heading: Duplicate Charges, must_state: ["Duplicate charges are verified against transaction records.", "Once verified, the duplicate charge is reversed within 2 business days; bank posting can take up to 10 business days."]}
      - {id: "4.2", heading: Incorrect Charges, must_state: ["Incorrect charges are investigated within 5 business days and any overcharge is refunded to the original payment method."]}
      - {id: "4.3", heading: Dispute Window, must_state: ["Billing disputes must be raised within 60 days of the charge date; later disputes are policy exceptions that require Supervisor Review."]}
      - {id: "5", heading: Subscription Billing, must_state: ["Subscription billing is governed by SUB-POL-22."]}
      - {id: "6", heading: Refund Reconciliation}
      - {id: "6.1", heading: Payment Trace, must_state: ["When a refund confirmed as issued has not appeared after 10 business days, Billing Operations opens a payment trace."]}
      - {id: "6.2", heading: Trace Reference, must_state: ["The customer receives the payment trace reference within 3 business days."]}
      - {id: "7", heading: Chargebacks}
      - {id: "7.1", heading: Chargeback Mentions, must_state: ["Customers who mention a chargeback or bank dispute are referred to a Billing supervisor (Supervisor Review)."]}
      - {id: "7.2", heading: No Discouragement, must_state: ["Staff must not discourage customers from contacting their bank or threaten account suspension."]}
      - {id: "8", heading: Payment Security, must_state: ["Staff must never request full card numbers, CVV codes, passwords or one-time codes; verification uses the last four digits of the card."]}
      - {id: "9", heading: Fraudulent Transactions, must_state: ["Suspected fraudulent transactions are reported to Account Security under SEC-POL-09 section 4.4."]}

  - doc_id: CAN-POL-06
    title: Cancellation Policy
    doc_type: policy
    owner: DEPT-BIL
    topics: [cancellation, orders, subscriptions, cooling-off, installation-appointments]
    versions:
      - {version: "1.2", status: Active, effective_date: 2025-09-01, expiry_date: null, format: docx}
    sections:
      - {id: "1", heading: Purpose}
      - {id: "2", heading: Scope}
      - {id: "3", heading: Order Cancellation}
      - {id: "3.1", heading: Before Dispatch, must_state: ["Orders can be cancelled at no cost before dispatch."]}
      - {id: "3.2", heading: After Dispatch, must_state: ["After dispatch the return process in REF-POL-02 applies."]}
      - {id: "4", heading: Subscription Cancellation}
      - {id: "4.1", heading: Cancel Any Time, must_state: ["Subscriptions can be cancelled at any time; cancellation takes effect at the end of the current billing period."]}
      - {id: "4.2", heading: Monthly Plans, must_state: ["Monthly plans are not refunded for partial months."]}
      - {id: "4.3", heading: Annual Plans, must_state: ["Annual plans cancelled within 14 days of purchase or renewal receive a full refund.", "After 14 days the service continues until the end of the term without a refund."]}
      - {id: "5", heading: Cancellation Not Honoured}
      - {id: "5.1", heading: Charges After Cancellation, must_state: ["If a customer is charged after a confirmed cancellation, the post-cancellation charge is refunded in full within 5 business days after verification."]}
      - {id: "6", heading: Pro Install Appointments}
      - {id: "6.1", heading: Appointment Cancellation, must_state: ["Pro Install appointments can be cancelled free of charge up to 24 hours before the appointment; later cancellations incur a USD 25 fee."]}

  - doc_id: WAR-POL-07
    title: Warranty Policy
    doc_type: policy
    owner: DEPT-WAR
    topics: [warranty, care-plus, claims, exclusions, appeals]
    versions:
      - {version: "2.0", status: Active, effective_date: 2025-07-01, expiry_date: null, format: pdf}
    sections:
      - {id: "1", heading: Purpose}
      - {id: "2", heading: Scope}
      - {id: "3", heading: Warranty Coverage}
      - {id: "3.1", heading: 12-Month Products, must_state: ["12 months from delivery: Sentinel Indoor Camera, Sentinel Outdoor Camera, Glide Robot Vacuum, Halo Smart Speaker, Spark Smart Plug, Beam Smart Bulb."]}
      - {id: "3.2", heading: 24-Month Products, must_state: ["24 months from delivery: Aura Smart Thermostat, PowerCell Portable Power Station, Keystone Smart Lock, Nexus Home Hub, Breeze Air Purifier."]}
      - {id: "4", heading: Claim Process}
      - {id: "4.1", heading: Claim Requirements, must_state: ["A warranty claim requires proof of purchase (order reference), a description of the fault and completion of basic troubleshooting (TEC-GDL-20)."]}
      - {id: "4.2", heading: Decision Time, must_state: ["Warranty Services decides a complete claim within 10 business days."]}
      - {id: "4.3", heading: Remedies, must_state: ["Remedies are repair, replacement, or refund where repair or replacement is not possible."]}
      - {id: "5", heading: Exclusions, must_state: ["physical or liquid damage", "unauthorised repair or modification", "normal wear such as vacuum brushes and filters", "cosmetic damage that does not affect function"]}
      - {id: "6", heading: Care+ Protection Plan}
      - {id: "6.1", heading: Extended Coverage, must_state: ["Care+ extends coverage to 36 months from delivery."]}
      - {id: "6.2", heading: Accidental Damage, must_state: ["Care+ covers up to 2 accidental-damage claims per 12 months with a USD 29 service fee per claim."]}
      - {id: "6.3", heading: Advance Replacement, must_state: ["Care+ members receive advance replacement under RPL-POL-03 section 4.3."]}
      - {id: "7", heading: Appeals}
      - {id: "7.1", heading: Appeal Window, must_state: ["Customers may appeal a warranty denial within 30 days of the decision."]}
      - {id: "7.2", heading: Appeal Review, must_state: ["Appeals are reviewed by a Warranty Services supervisor (Supervisor Review) within 10 business days."]}
      - {id: "8", heading: Safety-Related Defects, must_state: ["Safety-related defects are handled under SAF-POL-10 regardless of warranty status."]}

  - doc_id: PRV-POL-08
    title: Privacy and Data Protection Policy
    doc_type: policy
    owner: DEPT-CMP
    topics: [privacy, data-rights, consent, marketing, camera-footage, privacy-incident]
    versions:
      - {version: "4.0", status: Active, effective_date: 2026-03-01, expiry_date: null, format: pdf}
    sections:
      - {id: "1", heading: Purpose}
      - {id: "2", heading: Scope}
      - {id: "3", heading: Principles, must_state: ["Personal data is processed lawfully, minimally, securely and transparently."]}
      - {id: "4", heading: Data Rights Requests}
      - {id: "4.1", heading: Rights, must_state: ["Customers can request access to, export of, or deletion of their personal data."]}
      - {id: "4.2", heading: Fulfilment Time, must_state: ["Requests are fulfilled within 30 calendar days after identity verification."]}
      - {id: "4.3", heading: Overdue Requests, must_state: ["Overdue data-rights requests are escalated to Compliance Review."]}
      - {id: "5", heading: Marketing and Consent}
      - {id: "5.1", heading: Consent Required, must_state: ["Marketing is sent only with the customer's consent."]}
      - {id: "5.2", heading: Opt-Out, must_state: ["Opt-outs are processed within 10 business days; marketing received after that period is a consent breach."]}
      - {id: "5.3", heading: No Sale of Data, must_state: ["Lumora never sells personal data; sharing with partners requires explicit consent."]}
      - {id: "6", heading: Camera and Audio Data}
      - {id: "6.1", heading: Access Control, must_state: ["Camera footage and audio are encrypted and accessible only to the account owner and invited users."]}
      - {id: "6.2", heading: Staff Access, must_state: ["Lumora staff may view footage only with the customer's explicit consent for support purposes."]}
      - {id: "7", heading: Privacy Incidents}
      - {id: "7.1", heading: Definition, must_state: ["Any report that personal data or footage may have been exposed - including a customer seeing another person's data - is a privacy incident."]}
      - {id: "7.2", heading: Logging, must_state: ["The incident is logged and the Privacy Officer notified within 24 hours."]}
      - {id: "7.3", heading: Assessment, must_state: ["Compliance & Privacy completes an assessment within 72 hours."]}
      - {id: "7.4", heading: Containment, must_state: ["Containment actions: revoke shared links and sessions, disable affected features and preserve logs."]}
      - {id: "8", heading: Prohibited Practices, must_state: ["disclosing another customer's data", "requesting unnecessary personal data", "promising the outcome of a regulatory assessment", "asking the customer to delete evidence"]}

  - doc_id: SEC-POL-09
    title: Account Security Policy
    doc_type: policy
    owner: DEPT-SEC
    topics: [security, unauthorized-access, account-takeover, smart-lock, identity-verification, login]
    versions:
      - {version: "2.0", status: Active, effective_date: 2025-10-01, expiry_date: null, format: docx}
    sections:
      - {id: "1", heading: Purpose}
      - {id: "2", heading: Scope}
      - {id: "3", heading: Authentication, must_state: ["Two-factor authentication is recommended for all accounts; password reset links expire after 30 minutes."]}
      - {id: "4", heading: Suspected Unauthorised Access}
      - {id: "4.1", heading: Containment, must_state: ["After identity verification, lock the account, revoke all active sessions and force a password reset."]}
      - {id: "4.2", heading: Activity Review, must_state: ["Review account activity for the previous 30 days."]}
      - {id: "4.3", heading: Response Time, must_state: ["Respond within 1 hour; treat as P0 when the account was taken over, orders were placed or device access was changed."]}
      - {id: "4.4", heading: Unauthorised Purchases, must_state: ["Unauthorised purchases are reversed by Billing Operations after investigation."]}
      - {id: "5", heading: Smart-Lock and Device Security}
      - {id: "5.1", heading: Unexplained Lock Events, must_state: ["Unexplained lock or unlock events are critical security incidents."]}
      - {id: "5.2", heading: Interim Advice, must_state: ["Advise the customer to use the physical key and disable remote access until the investigation is complete."]}
      - {id: "5.3", heading: Mandatory Escalation, must_state: ["Critical Management Escalation is mandatory for smart-lock security incidents."]}
      - {id: "6", heading: Identity Verification, must_state: ["Verify identity with the registered email plus the last four digits of the payment card or an order reference.", "Never ask for passwords, full card numbers, CVV codes or one-time codes."]}
      - {id: "7", heading: Login Problems}
      - {id: "7.1", heading: Password Reset, must_state: ["Guide the customer through the password reset process."]}
      - {id: "7.2", heading: Account Recovery, must_state: ["Account recovery is completed within 2 business days after identity verification."]}

  - doc_id: SAF-POL-10
    title: Product Safety Policy
    doc_type: policy
    owner: DEPT-SAF
    topics: [safety, overheating, fire, electrical-hazard, injury, recall, hazardous-collection]
    versions:
      - {version: "2.0", status: Active, effective_date: 2025-08-15, expiry_date: null, format: pdf}
    sections:
      - {id: "1", heading: Purpose}
      - {id: "2", heading: Scope}
      - {id: "3", heading: Safety Incident Definition, must_state: ["overheating, smoke, burning smell, melting, swelling batteries, sparks, electric shock, fire or any injury"]}
      - {id: "4", heading: Immediate Actions}
      - {id: "4.1", heading: Stop Using, must_state: ["Advise the customer to stop using the product and to disconnect it from power only if it is safe to do so."]}
      - {id: "4.2", heading: Incident Log, must_state: ["Log a safety incident within 1 hour."]}
      - {id: "4.3", heading: Notify Product Safety, must_state: ["Notify the Product Safety team."]}
      - {id: "4.4", heading: Escalation Level, must_state: ["Critical Management Escalation is mandatory when there is fire, an injury, or a child involved; otherwise escalate to the Specialist Team."]}
      - {id: "5", heading: Product Collection}
      - {id: "5.1", heading: Specialist Collection, must_state: ["Product Safety arranges specialist collection of hazardous products."]}
      - {id: "5.2", heading: No Postal Returns of Batteries, must_state: ["Never instruct customers to post or courier a damaged, swollen or overheating lithium battery."]}
      - {id: "6", heading: Remedy, must_state: ["After assessment, confirmed safety defects receive a full refund or replacement regardless of warranty status or refund window."]}
      - {id: "7", heading: Communication}
      - {id: "7.1", heading: No Liability Statements, must_state: ["Do not admit liability or speculate about the cause."]}
      - {id: "7.2", heading: Never Dismiss, must_state: ["Never dismiss or minimise a reported safety concern."]}
      - {id: "7.3", heading: Injury Review, must_state: ["Injury cases are reviewed by Compliance."]}
      - {id: "8", heading: Recalls}
      - {id: "8.1", heading: Recall Complaints, must_state: ["Complaints that mention a recall notice reach Product Safety within 4 hours."]}

  - doc_id: CPN-POL-11
    title: Compensation and Goodwill Policy
    doc_type: policy
    owner: DEPT-CRL
    topics: [compensation, goodwill, store-credit, approval-limits, entitlements]
    versions:
      - {version: "1.3", status: Active, effective_date: 2026-01-01, expiry_date: null, format: docx}
    sections:
      - {id: "1", heading: Purpose}
      - {id: "2", heading: Scope}
      - {id: "3", heading: Principles}
      - {id: "3.1", heading: Discretionary Compensation, must_state: ["Compensation is discretionary unless a policy defines an entitlement."]}
      - {id: "3.2", heading: No Guarantees, must_state: ["Compensation must never be promised or guaranteed before eligibility is verified."]}
      - {id: "4", heading: Approved Compensation Types, must_state: ["store credit", "shipping-fee refund", "one month of subscription credit", "free expedited shipping on a replacement"]}
      - {id: "5", heading: Approval Limits}
      - {id: "5.1", heading: Agents, must_state: ["Agents may approve goodwill compensation up to USD 25."]}
      - {id: "5.2", heading: Supervisors, must_state: ["Supervisors may approve up to USD 100."]}
      - {id: "5.3", heading: Department Managers, must_state: ["Department Managers may approve up to USD 500."]}
      - {id: "5.4", heading: Management, must_state: ["Compensation above USD 500, or any cash payment, requires Management Escalations."]}
      - {id: "6", heading: Policy Entitlements, must_state: ["delivery delay credit (DEL-POL-04 section 5.2)", "Cloud Vault outage credit (SUB-POL-22 section 6.1)", "late express shipping fee refund (DEL-POL-04 section 5.3)"]}
      - {id: "7", heading: Not Eligible, must_state: ["problems caused by the customer", "force-majeure events", "requests based on promises that cannot be verified", "requests that cite policies that do not exist"]}
      - {id: "8", heading: Prohibited Practices, must_state: ["cash compensation", "compensation offered in exchange for withdrawing a complaint or a review", "compensation for legal claims without Compliance approval", "describing compensation as guaranteed"]}

  - doc_id: ESC-SOP-12
    title: Escalation Procedure
    doc_type: sop
    owner: DEPT-MGT
    topics: [escalation, escalation-levels, triggers, escalation-notes]
    versions:
      - version: "3.0"
        status: Previous
        effective_date: 2025-01-01
        expiry_date: 2025-12-31
        format: docx
        superseded_by: "3.1"
        notes: >-
          Previous version. Differences: s4.5 Supervisor Review only after 3 prior unresolved complaints; s4.6 high value
          threshold USD 1,000 for Supervisor Review; no smart-lock rule. Same numbering scheme.
      - {version: "3.1", status: Active, effective_date: 2026-01-01, expiry_date: null, format: pdf, supersedes: "3.0"}
      - version: "3.2"
        status: Draft
        effective_date: 2026-12-01
        expiry_date: null
        format: docx
        notes: >-
          DRAFT - NOT APPROVED. Proposes: s4.5 Supervisor Review after 1 prior unresolved complaint; s4.6 high value threshold
          USD 300. Must visibly state DRAFT - NOT FOR OPERATIONAL USE.
    sections:
      - {id: "1", heading: Purpose}
      - {id: "2", heading: Scope}
      - {id: "3", heading: Escalation Levels}
      - {id: "3.1", heading: No Escalation, must_state: ["Handled by the assigned department within normal SLA."]}
      - {id: "3.2", heading: Supervisor Review, must_state: ["A team supervisor reviews and approves the handling."]}
      - {id: "3.3", heading: Department Manager, must_state: ["The responsible department manager owns the decision."]}
      - {id: "3.4", heading: Specialist Team, must_state: ["A specialist team (Product Safety or Account Security) takes over investigation."]}
      - {id: "3.5", heading: Compliance Review, must_state: ["Compliance & Privacy reviews for legal, regulatory, privacy or conduct risk."]}
      - {id: "3.6", heading: Critical Management Escalation, must_state: ["Senior management is engaged immediately for critical risk to people, homes or the business."]}
      - {id: "4", heading: Mandatory Escalation Triggers}
      - {id: "4.1", heading: Safety, must_state: ["Fire, smoke, flames or explosion: Critical Management Escalation.", "Overheating, swelling batteries, sparks or electric shock without injury: Specialist Team (Product Safety).", "Any injury, or any incident involving a child: Critical Management Escalation."]}
      - {id: "4.2", heading: Security, must_state: ["Unauthorised account access or account takeover: Specialist Team (Account Security).", "Unexplained smart-lock unlock events: Critical Management Escalation.", "Fraudulent payments: Specialist Team (Account Security)."]}
      - {id: "4.3", heading: Privacy, must_state: ["Exposure of personal data or footage, data shared without consent, overdue data-rights requests and incidents involving children's data: Compliance Review."]}
      - {id: "4.4", heading: Legal, must_state: ["Threats of legal action or references to lawyers, courts or regulators: Compliance Review."]}
      - {id: "4.5", heading: Repeat Unresolved Complaints, must_state: ["2 prior unresolved complaints on the same issue within 90 days: Supervisor Review.", "3 or more prior unresolved complaints: Department Manager.", "A reopened complaint: Supervisor Review."]}
      - {id: "4.6", heading: High Value, must_state: ["Disputed or claimed amount of USD 500 or more: Supervisor Review.", "USD 1,500 or more: Department Manager.", "Business-account orders of USD 2,500 or more: Department Manager."]}
      - {id: "4.7", heading: Severe Service Failure, must_state: ["Cloud Vault or hub outages causing lost recordings or disabled home security: Department Manager."]}
      - {id: "4.8", heading: Critical Customer Impact, must_state: ["Customer locked out of the home, loss of heating or cooling in extreme weather, or dependence on the device for medical needs: Specialist Team.", "When a vulnerable person (elderly, disabled, medically dependent or an infant) is affected: Critical Management Escalation."]}
      - {id: "4.9", heading: Policy Exceptions, must_state: ["Requests outside policy limits or windows: Supervisor Review.", "Compensation requests above the agent limit: Supervisor Review; above USD 100: Department Manager."]}
      - {id: "4.10", heading: Staff Misconduct, must_state: ["Harassment, discrimination or threats by staff: Compliance Review.", "Property damage or theft allegations against technicians: Department Manager."]}
      - {id: "4.11", heading: SLA Breach, must_state: ["An SLA breach on a P0 or P1 complaint: Department Manager."]}
      - {id: "4.12", heading: Reputational and Financial Risk, must_state: ["Threats of public media exposure: Supervisor Review.", "Chargeback threats: Supervisor Review."]}
      - {id: "4.13", heading: Replacement Failure, must_state: ["A replacement that is also defective: Supervisor Review."]}
      - {id: "4.14", heading: Recalls, must_state: ["Complaints related to a product recall: Specialist Team."]}
      - {id: "5", heading: Escalation Notes, must_state: ["complaint summary", "key facts", "reason for escalation", "actions already taken", "relevant policy", "required next action"]}
      - {id: "6", heading: Customer Acknowledgement, must_state: ["Escalations are acknowledged to the customer within the first-response target without promising an outcome."]}
      - {id: "7", heading: Multiple Triggers, must_state: ["When several triggers apply, the highest escalation level applies and all triggered departments are informed."]}

  - doc_id: CHP-SOP-13
    title: Complaint Handling Standard Operating Procedure
    doc_type: sop
    owner: DEPT-CRL
    topics: [complaints, procedure, response-standards, missing-information, agent-guidance, manual-review, follow-up]
    versions:
      - {version: "2.0", status: Active, effective_date: 2026-01-15, expiry_date: null, format: docx}
    sections:
      - {id: "1", heading: Purpose}
      - {id: "2", heading: Procedure Overview}
      - {id: "3", heading: Procedure Steps}
      - {id: "3.1", heading: Intake and Acknowledgement}
      - {id: "3.2", heading: Verification, must_state: ["Verify the customer's identity or account and the order or transaction before proposing a resolution."]}
      - {id: "3.3", heading: Classification, must_state: ["Record the primary issue, secondary issues, category and subcategory."]}
      - {id: "3.4", heading: Policy Check, must_state: ["Retrieve the active policy section and cite it."]}
      - {id: "3.5", heading: Resolution Proposal, must_state: ["Include all required actions and no prohibited actions."]}
      - {id: "3.6", heading: Validation, must_state: ["The automated rule validation must pass; otherwise the case goes to manual review."]}
      - {id: "3.7", heading: Customer Response}
      - {id: "3.8", heading: Follow-Up Scheduling}
      - {id: "3.9", heading: Closure}
      - {id: "4", heading: Response Standards, must_state: ["acknowledge the complaint", "show appropriate empathy", "summarise the issue", "explain the next step", "make no unsupported promises", "state timelines only when supported by policy or SLA", "use professional language", "supported tones: professional, empathetic, concise, formal"]}
      - {id: "5", heading: Missing Information, must_state: ["Request a missing order number, transaction date, product, problem description or evidence with focused clarification questions."]}
      - {id: "6", heading: Agent Guidance Standards, must_state: ["verify account", "check transaction", "review shipment", "request evidence", "consult supervisor", "do not promise a refund before verification"]}
      - {id: "7", heading: Manual Review Triggers, must_state: ["significant disagreement between the AI recommendation and the rule validation", "missing policy support", "ambiguous complaints", "unclear escalation", "policy contradictions", "sensitive cases (safety, privacy, legal, staff misconduct)", "invalid AI output after retries"]}
      - {id: "8", heading: Follow-Up Types, must_state: ["request for additional information", "resolution confirmation", "refund-status update", "replacement-status update", "escalation acknowledgement", "closure confirmation"]}

  - doc_id: RTE-RUL-14
    title: Department Routing Rules
    doc_type: rules
    owner: DEPT-MGT
    topics: [routing, departments, multi-department]
    versions:
      - {version: "2.0", status: Active, effective_date: 2026-01-01, expiry_date: null, format: pdf}
    sections:
      - {id: "1", heading: Purpose}
      - {id: "2", heading: Routing Principles, must_state: ["The primary department owns the case; supporting departments contribute actions for secondary issues."]}
      - {id: "3", heading: Routing Table, must_state: ["Include a full table: subcategory -> primary department -> supporting departments, exactly as in rules/routing_rules/routing_rules.yaml (the author must read that file)."]}
      - {id: "4", heading: Multi-Department Routing}
      - {id: "4.1", heading: Secondary Issues, must_state: ["Each secondary issue adds its primary department as a supporting department."]}
      - {id: "4.2", heading: Privacy and Legal Signals, must_state: ["Privacy signals and legal threats add Compliance & Privacy as a supporting department."]}
      - {id: "4.3", heading: Critical Escalations, must_state: ["Critical Management Escalations add Management Escalations as a supporting department."]}
      - {id: "4.4", heading: Security Signals, must_state: ["Security signals add Account Security as a supporting department."]}
      - {id: "5", heading: Routing Precedence, must_state: ["When the primary issue is unclear, precedence is Safety, then Security, then Privacy, then Legal, then Billing, then Product Defect, then Delivery, then Warranty, then all other categories.", "Root-cause issues outrank the refund consequences they cause: a product that arrived damaged and whose refund has not been processed has the primary issue Damaged on Arrival and the secondary issue Refund Delay."]}

  - doc_id: SLA-RUL-15
    title: Service Level Rules
    doc_type: rules
    owner: DEPT-MGT
    topics: [sla, priority-matrix, urgency, impact, sla-risk]
    versions:
      - {version: "2.0", status: Active, effective_date: 2026-01-01, expiry_date: null, format: pdf}
    sections:
      - {id: "1", heading: Purpose}
      - {id: "2", heading: Scope}
      - {id: "3", heading: SLA Targets}
      - {id: "3.1", heading: P0 Critical, must_state: ["First response within 1 hour; resolution within 24 hours."]}
      - {id: "3.2", heading: P1 High, must_state: ["First response within 4 hours; resolution within 48 hours."]}
      - {id: "3.3", heading: P2 Medium, must_state: ["First response within 24 hours; resolution within 120 hours (5 days)."]}
      - {id: "3.4", heading: P3 Low, must_state: ["First response within 48 hours; resolution within 240 hours (10 days)."]}
      - {id: "3.5", heading: SLA Clock, must_state: ["SLA clocks run continuously in calendar hours from submission."]}
      - {id: "4", heading: Priority Matrix, must_state: ["Priority is determined by urgency and impact: Critical urgency: P0 for High or Medium impact, P1 for Low impact. High urgency: P1 for High impact, P2 for Medium or Low impact. Medium urgency: P2 for High or Medium impact, P3 for Low impact. Low urgency: P2 for High impact, P3 for Medium or Low impact."]}
      - {id: "5", heading: Urgency Levels}
      - {id: "5.1", heading: Critical, must_state: ["immediate risk to personal safety, an active security breach, compromised physical home security, fire or injury"]}
      - {id: "5.2", heading: High, must_state: ["privacy exposure, legal threats, significant financial loss, complete loss of an essential service, repeat unresolved issues, delivery delays and lost packages"]}
      - {id: "5.3", heading: Medium, must_state: ["product or service impaired, billing errors, returns and refunds, warranty claims"]}
      - {id: "5.4", heading: Low, must_state: ["minor inconvenience, cosmetic issues, general feedback", "Customer type (including VIP) and emotional tone never change urgency."]}
      - {id: "6", heading: Impact Levels, must_state: ["High: safety, security or privacy harm, an amount of USD 500 or more, or loss of an essential home service.", "Medium: product or service degraded, or financial loss under USD 500.", "Low: inconvenience only."]}
      - {id: "7", heading: SLA Risk}
      - {id: "7.1", heading: At Risk, must_state: ["A complaint is At Risk when 75% of an SLA window has elapsed without the target being met."]}
      - {id: "7.2", heading: Breach, must_state: ["A complaint is Breached when the window elapses; P0 and P1 breaches trigger ESC-SOP-12 section 4.11."]}

  - doc_id: FAQ-GEN-16
    title: Customer FAQ
    doc_type: faq
    owner: DEPT-CRL
    topics: [faq, delivery, returns, refunds, warranty, care-plus, account, privacy, safety, subscriptions]
    versions:
      - version: "5.0"
        status: Active
        effective_date: 2026-02-15
        expiry_date: null
        format: docx
        notes: >-
          DELIBERATE CONFLICT (for the contradictory-policy challenge): answer 2.2 must say "Refunds are issued within
          3 business days of receiving your return." This conflicts with REF-POL-02 s4.3 (5 business days after inspection
          approval). The system must resolve it by precedence (policy beats FAQ). Everything else must be consistent with policy.
    sections:
      - {id: "1", heading: Orders and Delivery}
      - {id: "1.1", heading: "How long does delivery take?", must_state: ["Standard 3 to 5 business days; express 1 to 2 business days."]}
      - {id: "1.2", heading: "My order is late - what happens?", must_state: ["We check with the carrier; delays of more than 3 business days on standard shipping may qualify for a USD 10 store credit after verification."]}
      - {id: "1.3", heading: My package is lost, must_state: ["After a carrier trace of up to 5 business days we reship or refund."]}
      - {id: "2", heading: Returns and Refunds}
      - {id: "2.1", heading: "Can I return a product?", must_state: ["Within 30 days of delivery; 45 days for Care+ members."]}
      - {id: "2.2", heading: "How long do refunds take?", must_state: ["Refunds are issued within 3 business days of receiving your return."]}
      - {id: "3", heading: Warranty and Care+}
      - {id: "3.1", heading: "How long is the warranty?", must_state: ["12 or 24 months depending on the product; 36 months with Care+."]}
      - {id: "3.2", heading: "What does Care+ include?", must_state: ["extended coverage, 2 accidental-damage claims per year with a USD 29 fee, advance replacement"]}
      - {id: "4", heading: Account and App}
      - {id: "4.1", heading: I cannot sign in, must_state: ["Use Forgot Password; reset links expire after 30 minutes."]}
      - {id: "4.2", heading: "Should I use two-factor authentication?", must_state: ["Yes, we recommend it."]}
      - {id: "5", heading: Privacy}
      - {id: "5.1", heading: "Who can see my camera footage?", must_state: ["Only you and people you invite; our staff only with your explicit consent."]}
      - {id: "5.2", heading: "How do I delete my data?", must_state: ["Submit a data request; fulfilled within 30 days after identity verification."]}
      - {id: "6", heading: Safety}
      - {id: "6.1", heading: My device is overheating, must_state: ["Stop using it, unplug it only if safe, and contact us immediately. Do not post a damaged battery."]}
      - {id: "7", heading: Subscriptions}
      - {id: "7.1", heading: "How do I cancel Cloud Vault?", must_state: ["Cancel any time in the app; it ends at the end of the billing period; annual plans cancelled within 14 days are fully refunded."]}

  - doc_id: FAQ-BIL-17
    title: Billing and Refunds FAQ
    doc_type: faq
    owner: DEPT-BIL
    topics: [faq, billing, refunds, subscriptions, payment-security]
    versions:
      - version: "1.0"
        status: Previous
        effective_date: 2024-06-01
        expiry_date: 2026-01-31
        format: docx
        superseded_by: "2.0"
