      - {id: "2", heading: Conduct Standards, must_state: ["Staff are respectful, accurate and never make commitments outside policy."]}
      - {id: "3", heading: Support Service Standards}
      - {id: "3.1", heading: First-Contact Resolution}
      - {id: "3.2", heading: Warm Transfers}
      - {id: "3.3", heading: Callback Commitments}
      - {id: "4", heading: Accuracy of Information}
      - {id: "4.1", heading: No Out-of-Policy Commitments, must_state: ["Staff must not make commitments outside policy."]}
      - {id: "4.2", heading: Correcting Misinformation, must_state: ["Incorrect information given by staff is corrected; a commitment is honoured only when it is within policy, otherwise the case goes to Supervisor Review."]}
      - {id: "5", heading: Complaints About Staff}
      - {id: "5.1", heading: Record Review, must_state: ["Interaction records are reviewed within 5 business days."]}
      - {id: "5.2", heading: Outcome Communication, must_state: ["The customer is informed of the outcome without disclosure of disciplinary details."]}
      - {id: "6", heading: Serious Misconduct, must_state: ["Harassment, discrimination or threats: Compliance Review.", "Theft or property damage: Department Manager."]}

