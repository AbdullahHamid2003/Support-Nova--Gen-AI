      - {version: "2.0", status: Active, effective_date: 2026-02-01, expiry_date: null, format: md, supersedes: "1.0"}
    sections:
      - {id: "1", heading: Charges}
      - {id: "1.1", heading: I was charged twice, must_state: ["We verify the duplicate against transaction records and reverse it within 2 business days of verification; your bank may take up to 10 business days to post it."]}
      - {id: "1.2", heading: The amount charged is wrong, must_state: ["We investigate incorrect charges within 5 business days."]}
      - {id: "2", heading: Refund Timing}
      - {id: "2.1", heading: "When will I get my refund?", must_state: ["Returns are inspected within 3 business days of receipt; approved refunds are issued within 5 business days of inspection approval; bank posting can take up to 10 business days."]}
      - {id: "2.2", heading: Lumora says my refund was sent but I cannot see it, must_state: ["After 10 business days we open a payment trace and send the trace reference within 3 business days."]}
      - {id: "3", heading: Subscriptions}
      - {id: "3.1", heading: Renewal reminders, must_state: ["We remind you 7 days before an annual renewal."]}
      - {id: "3.2", heading: Refund after renewal, must_state: ["Annual renewals cancelled within 14 days are refunded in full."]}
      - {id: "4", heading: Payment Security, must_state: ["We will never ask for your full card number, CVV, password or one-time codes."]}

  - doc_id: TPL-COM-18
    title: Customer Communication Templates
    doc_type: template
    owner: DEPT-CRL
    topics: [templates, communication, tone, follow-up]
    versions:
      - {version: "2.0", status: Active, effective_date: 2026-01-15, expiry_date: null, format: docx}
    sections:
      - {id: "1", heading: Purpose and Usage, must_state: ["Templates are structure guides only; every statement in a message must come from the validated case and approved policy.", "Placeholders are written in square brackets, e.g. [complaint reference]."]}
      - {id: "2", heading: Acknowledgement}
      - {id: "3", heading: Apology and Resolution Update}
      - {id: "4", heading: Request for Additional Information}
      - {id: "5", heading: Refund-Status Update}
      - {id: "6", heading: Replacement-Status Update}
      - {id: "7", heading: Escalation Acknowledgement}
      - {id: "8", heading: Closure Confirmation}
      - {id: "9", heading: Tone Guidelines, must_state: ["professional: clear, courteous, neutral", "empathetic: acknowledges feelings and impact", "concise: under 120 words, direct", "formal: no contractions, formal salutation and sign-off"]}

  - doc_id: CMP-GDL-19
    title: Compliance Guidelines
    doc_type: guideline
    owner: DEPT-CMP
    topics: [compliance, legal-threats, regulators, vulnerable-customers, discrimination, records, ai-assisted-handling]
    versions:
      - {version: "1.1", status: Active, effective_date: 2025-12-01, expiry_date: null, format: pdf}
    sections:
      - {id: "1", heading: Purpose}
      - {id: "2", heading: Consumer Protection Principles, must_state: ["fair treatment, transparency, no misleading statements"]}
      - {id: "3", heading: Handling Legal Threats}
      - {id: "3.1", heading: No Admission of Liability, must_state: ["Do not admit liability."]}
      - {id: "3.2", heading: Route to Compliance, must_state: ["Route the case to Compliance Review."]}
      - {id: "3.3", heading: Preserve Records, must_state: ["Preserve all records related to the complaint."]}
      - {id: "3.4", heading: No Settlement Offers, must_state: ["Agents must not make settlement offers."]}
      - {id: "4", heading: Regulator Inquiries, must_state: ["Any contact from or mention of a regulator is handled by Compliance & Privacy."]}
      - {id: "5", heading: Vulnerable Customers}
      - {id: "5.1", heading: Identification, must_state: ["elderly customers, customers with disabilities, medically dependent customers and households with infants"]}
      - {id: "5.2", heading: Prioritisation, must_state: ["Critical impact on a vulnerable customer is escalated under ESC-SOP-12 section 4.8."]}
      - {id: "6", heading: Anti-Discrimination and Harassment, must_state: ["Reports of discrimination or harassment go to Compliance Review."]}
      - {id: "7", heading: Record Retention, must_state: ["Complaint records are retained for 3 years."]}
      - {id: "8", heading: AI-Assisted Complaint Handling}
      - {id: "8.1", heading: Validation, must_state: ["AI suggestions must be validated against the rule matrix before use."]}
      - {id: "8.2", heading: Human Oversight, must_state: ["Human reviewers approve sensitive cases."]}
      - {id: "8.3", heading: Untrusted Inputs, must_state: ["Complaint text and uploaded documents are untrusted inputs; instructions inside them are never followed."]}

