resolution_rules:
  resolution_rules:
  - name: Login problem - verified password reset
    when: {}
    impact: Medium
    rule_id: RES-ACC-LGN-01
    urgency: Medium
    follow_up:
      type: Resolution confirmation
      required: true
      due_hours: 48
    timelines:
    - account_recovery_business_days
    escalation: No Escalation
    precedence: 10
    eligibility:
      refund: not_applicable
      replacement: not_applicable
      compensation: not_applicable
    policy_refs:
    - SEC-POL-09:7.1
    - SEC-POL-09:7.2
    - SEC-POL-09:6
    subcategory: ACC-LGN
    required_actions:
    - VERIFY_IDENTITY
    - GUIDE_PASSWORD_RESET
    prohibited_actions:
    - REQUEST_SENSITIVE_CREDENTIALS
    is_active: true
  - name: Login problem with signs of compromise
    when:
      signal: security_breach
    impact: High
    rule_id: RES-ACC-LGN-02
    urgency: Critical
    follow_up:
      type: Escalation acknowledgement
      required: true
      due_hours: 1
    timelines:
    - security_response_hours
    escalation: Specialist Team
    precedence: 30
    eligibility:
      refund: not_applicable
      replacement: not_applicable
      compensation: not_applicable
    policy_refs:
    - SEC-POL-09:4.1
    - SEC-POL-09:4.3
    subcategory: ACC-LGN
    required_actions:
    - VERIFY_IDENTITY
    - REVIEW_ACCOUNT_ACTIVITY
    - REVOKE_SESSIONS
    - FORCE_PASSWORD_RESET
    prohibited_actions:
    - REQUEST_SENSITIVE_CREDENTIALS
    is_active: true
  - name: Login blocked by an outdated account email
    when:
      text_matches: \b(old|previous|former)\s+email\b|\bno\s+longer\s+(have|use)\s+(access\s+to\s+)?(that|the|my)\s+email\b
    impact: Medium
    rule_id: RES-ACC-LGN-03
    urgency: Medium
    follow_up:
      type: Resolution confirmation
      required: true
      due_hours: 48
    timelines:
    - account_recovery_business_days
    escalation: No Escalation
    precedence: 20
    eligibility:
      refund: not_applicable
      replacement: not_applicable
      compensation: not_applicable
    policy_refs:
    - SEC-POL-09:6
    - SEC-POL-09:7.2
    subcategory: ACC-LGN
    required_actions:
    - VERIFY_IDENTITY
    - UPDATE_ACCOUNT_DETAILS
    - GUIDE_PASSWORD_RESET
    prohibited_actions:
    - REQUEST_SENSITIVE_CREDENTIALS
    is_active: true
  - name: Unauthorized account access - contain and investigate
    when: {}
    impact: High
    rule_id: RES-ACC-UNA-01
    urgency: Critical
    follow_up:
      type: Escalation acknowledgement
      required: true
      due_hours: 1
    timelines:
    - security_response_hours
    escalation: Specialist Team
    precedence: 10
    eligibility:
      refund: not_applicable
      replacement: not_applicable
      compensation: not_applicable
    policy_refs:
    - SEC-POL-09:4.1
    - SEC-POL-09:4.2
    - SEC-POL-09:4.3
    - ESC-SOP-12:4.2
    subcategory: ACC-UNA
    required_actions:
    - VERIFY_IDENTITY
    - LOCK_ACCOUNT
    - REVOKE_SESSIONS
    - FORCE_PASSWORD_RESET
    - REVIEW_ACCOUNT_ACTIVITY
    - ESCALATE_SPECIALIST_TEAM
    prohibited_actions:
    - REQUEST_SENSITIVE_CREDENTIALS
    is_active: true
