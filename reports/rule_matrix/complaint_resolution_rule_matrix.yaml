      dimension: routing
    SCH-001:
      name: AI answer is complete and well-formed
      severity: critical
      dimension: schema
    SCH-002:
      name: Category and subcategory are valid
      severity: critical
      dimension: schema
    SCH-003:
      name: Departments are valid
      severity: critical
      dimension: schema
    SCH-004:
      name: Cited policies exist
      severity: major
      dimension: schema
    SCH-005:
      name: Escalation details are consistent
      severity: major
      dimension: schema
    SCH-006:
      name: Resolution steps use known actions
      severity: major
      dimension: schema
    SEC-001:
      name: AI ignored instructions in the complaint
      severity: critical
      dimension: security
    SEC-002:
      name: No sensitive data in the response
      severity: major
      dimension: security
    SEC-003:
      name: Complaint screened for manipulation
      severity: info
      dimension: security
  decision:
    review_below_score: 80
    verified_min_score: 80
  dimensions:
    policy: Cited policies, versions and conflicts
    schema: Complete AI answer with valid codes and references
    routing: Primary and supporting departments
    priority: Urgency and priority
    security: Manipulation attempts and sensitive data
    follow_up: Follow-up and missing information
    grounding: Facts backed by the complaint, policies or rules
    escalation: Required escalation, level and notes
    resolution: Required, recommended and prohibited actions
    eligibility: Refund, replacement and compensation eligibility
    communication: Customer response and follow-up message
    classification: Category, subcategory, secondary issues and sentiment
  status_values:
    fail: 0.0
    pass: 1.0
    warn: 0.5
  severity_weights:
    info: 0
    major: 3
    minor: 1
    critical: 5
