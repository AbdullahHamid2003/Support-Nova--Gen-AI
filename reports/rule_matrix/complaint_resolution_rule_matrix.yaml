taxonomy:
  categories:
  - code: ACC
    name: Account
    description: Lumora account access, security and profile management.
    is_active: true
    subcategories:
    - code: ACC-LGN
      name: Login Problem
      description: Customer cannot sign in
      is_active: true
    - code: ACC-UNA
      name: Unauthorized Account Access
      description: Someone else accessed or changed the customer's account
      is_active: true
    - code: ACC-UPD
      name: Account Update Issue
      description: Customer cannot update profile details such as email
      is_active: true
  - code: BIL
    name: Billing
    description: Charges, payments, subscription billing and cancellations that affect
      what the customer paid.
    is_active: true
    subcategories:
    - code: BIL-CAN
      name: Cancellation Not Honored
      description: Customer cancelled an order or subscription but was still charged
        or the cancellation was not processed.
      is_active: true
    - code: BIL-DUP
      name: Duplicate Charge
      description: The same order or subscription was charged more than once.
      is_active: true
    - code: BIL-INC
      name: Incorrect Charge
      description: Charged amount differs from the agreed price
      is_active: true
    - code: BIL-RFM
      name: Refund Missing
      description: Lumora confirmed a refund was issued but it has not appeared on
        the customer's statement.
      is_active: true
    - code: BIL-SUB
      name: Subscription Renewal
      description: Dispute about an automatic renewal charge for Cloud Vault or Care+.
      is_active: true
  - code: DEL
    name: Delivery
    description: Shipping and fulfilment of physical orders.
    is_active: true
    subcategories:
    - code: DEL-DLY
      name: Delayed Delivery
      description: Order not delivered by the estimated delivery date.
      is_active: true
    - code: DEL-LST
      name: Lost Package
      description: Package has no tracking updates for an extended period
      is_active: true
    - code: DEL-WRG
      name: Wrong Item Delivered
      description: Customer received a different product
      is_active: true
  - code: PRD
    name: Product Defect
    description: Physical product problems - damaged, faulty or incomplete devices.
    is_active: true
    subcategories:
    - code: PRD-DOA
      name: Damaged on Arrival
      description: Product arrived physically damaged or broken (cracked
      is_active: true
    - code: PRD-MAL
      name: Product Malfunction
      description: Device powers on but fails
      is_active: true
    - code: PRD-MIS
      name: Missing Parts
      description: Package is missing an accessory
      is_active: true
  - code: PRV
    name: Privacy
    description: Personal data, camera footage, consent and data-rights matters.
    is_active: true
    subcategories:
    - code: PRV-BRC
      name: Data Exposure
      description: Customer's personal data or footage exposed
      is_active: true
    - code: PRV-CON
      name: Consent and Marketing
      description: Unwanted marketing after opt-out or data shared without consent.
      is_active: true
    - code: PRV-DSR
      name: Data Rights Request
      description: Request to access
      is_active: true
  - code: REF
    name: Refund
    description: Requests for refunds and disputes about refunds that Lumora has not
      yet issued.
    is_active: true
    subcategories:
    - code: REF-DLY
      name: Refund Delay
      description: Return received or cancellation approved but Lumora has not issued
        the refund within the policy timeline.
      is_active: true
    - code: REF-PAR
      name: Partial Refund Dispute
      description: Customer received less than expected (restocking fee
      is_active: true
    - code: REF-REQ
      name: Refund Request
      description: Customer asks for their money back for a product or service.
      is_active: true
  - code: SAF
    name: Safety
    description: Any risk of harm to people or property caused by a Lumora product.
    is_active: true
    subcategories:
    - code: SAF-ELC
      name: Electrical Hazard
      description: Sparks
      is_active: true
    - code: SAF-INJ
      name: Injury Incident
      description: A person or pet was physically injured by a product.
      is_active: true
    - code: SAF-OVH
      name: Overheating or Fire Hazard
      description: Product overheats
      is_active: true
  - code: STF
    name: Staff Behavior
    description: Conduct of Lumora support agents and installation technicians.
    is_active: true
    subcategories:
    - code: STF-MIN
      name: Misinformation by Staff
      description: Staff member gave incorrect information or made a commitment Lumora
        did not honour.
      is_active: true
    - code: STF-MIS
      name: Technician Misconduct
      description: Technician damaged property
      is_active: true
    - code: STF-RUD
      name: Rude or Unprofessional Staff
      description: Staff member was rude
      is_active: true
  - code: SVC
    name: Service Quality
    description: Quality of Lumora's services - support interactions, installation
      work and online services.
    is_active: true
    subcategories:
    - code: SVC-INS
      name: Installation Service Quality
      description: Pro Install visit was late
      is_active: true
    - code: SVC-OUT
      name: Service Outage
      description: Cloud Vault
      is_active: true
    - code: SVC-SUP
      name: Poor Support Experience
      description: Long waits
      is_active: true
  - code: TEC
    name: Technical Support
    description: Device connectivity, app and set-up problems that can usually be
      solved by troubleshooting.
    is_active: true
    subcategories:
    - code: TEC-APP
      name: App or Software Issue
      description: Lumora Home app crashes
      is_active: true
    - code: TEC-CON
      name: Connectivity Issue
      description: Device will not connect to Wi-Fi
      is_active: true
    - code: TEC-SET
      name: Setup Issue
      description: Customer cannot complete initial set-up or configuration of a device.
      is_active: true
  - code: WAR
    name: Warranty
    description: Warranty and Care+ protection-plan claims.
    is_active: true
    subcategories:
    - code: WAR-CLM
      name: Warranty Claim
      description: Product failed within the warranty period and the customer requests
        repair or replacement.
      is_active: true
    - code: WAR-CPL
      name: Care+ Coverage Issue
      description: Problem with a Care+ claim
      is_active: true
    - code: WAR-DEN
      name: Warranty Denial Dispute
      description: Customer disputes a rejected warranty claim.
      is_active: true
