  conditional_routing:
  - name: Privacy signal adds Compliance
    when:
      signal: privacy_breach
    rule_id: RTE-101
    policy_refs:
    - RTE-RUL-14:4.2
    add_supporting:
    - DEPT-CMP
    is_active: true
  - name: Legal threat adds Compliance
    when:
      signal: legal_threat
    rule_id: RTE-102
    policy_refs:
    - RTE-RUL-14:4.2
    add_supporting:
    - DEPT-CMP
    is_active: true
  - name: Security signal adds Account Security
    when:
      signal: security_breach
    rule_id: RTE-103
    policy_refs:
    - RTE-RUL-14:4.4
    add_supporting:
    - DEPT-SEC
    is_active: true
  - name: Critical escalation adds Management
    when:
      escalation_level_at_least: Critical Management Escalation
    rule_id: RTE-104
