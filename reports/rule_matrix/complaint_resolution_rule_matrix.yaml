  prohibited_actions:
  - code: PROMISE_REFUND_BEFORE_VERIFICATION
    name: Promising a refund before verification
    patterns:
    - \b(we|i)\s*(will|'ll|have|are going to)\s*(definitely\s+|immediately\s+|now\s+)?(issue|process|send|give|approve|refund)\w*\s+(you\s+)?(a\s+|the\s+|your\s+)?(full\s+)?refund
    - \byou\s+will\s+(definitely\s+)?(get|receive)\s+(a\s+|your\s+)?(full\s+)?refund
    - \brefund\s+(has\s+been|is)\s+(approved|guaranteed)
    severity: critical
    policy_refs:
    - REF-POL-02:4.1
    - CHP-POL-01:6.1
  - code: GUARANTEE_COMPENSATION
    name: Guaranteeing compensation
    patterns:
    - \bguarantee[ds]?\b.{0,40}\b(compensation|credit|refund|voucher|payment)
    - \b(we|i)\s*(will|'ll)\s+(definitely\s+)?compensate\s+you
    - \byou\s+(will|are going to)\s+(definitely\s+)?(receive|get)\s+(a\s+)?(\$|usd\s*)?\d+.{0,20}(compensation|credit|voucher)
    severity: critical
    policy_refs:
    - CPN-POL-11:3.2
    - CPN-POL-11:8
  - code: CASH_COMPENSATION
    name: Offering cash compensation
    patterns:
    - \bcash\s+(compensation|payment|settlement)
    - \bpay\s+you\s+(\$|usd\s*)\d+
    severity: critical
    policy_refs:
    - CPN-POL-11:5.4
    - CPN-POL-11:8
  - code: GRANT_POLICY_EXCEPTION
    name: Granting or promising a policy exception without approval
    patterns:
    - \b(make|making|made|grant|granting)\s+(a|an)?\s*(one[- ]time\s+)?exception
    - \bas\s+a\s+(one[- ]time\s+)?(exception|courtesy exception)
    - \beven\s+though\s+(it\s+is|it's|you\s+are)\s+(outside|past|beyond)
    severity: critical
    policy_refs:
    - REF-POL-02:7.2
    - CHP-POL-01:6.1
  - code: ADMIT_LIABILITY
    name: Admitting liability
    patterns:
    - \b(we|lumora)\s+(are|is)\s+(fully\s+|entirely\s+)?(responsible|liable|at\s+fault)\b
    - \b(this|it)\s+(is|was)\s+(entirely\s+)?our\s+fault
    - \baccept\s+(full\s+)?(liability|responsibility)
    severity: major
    policy_refs:
    - SAF-POL-10:7.1
    - CMP-GDL-19:3.1
  - code: REQUEST_SENSITIVE_CREDENTIALS
    name: Requesting passwords, full card numbers, CVV or one-time codes
    patterns:
    - \b(send|provide|share|tell|give|confirm|reply\s+with)\s+(us\s+|me\s+)?(your\s+)?(current\s+)?(password|full\s+card\s+number|card\s+number|cvv|cvc|security\s+code|one[-
      ]time\s+(code|password)|otp|pin)\b
    severity: critical
    policy_refs:
    - SEC-POL-09:6
    - BIL-POL-05:8
  - code: SHIP_DAMAGED_BATTERY_BY_MAIL
    name: Instructing postal return of a damaged lithium battery
    patterns:
    - \b(post|mail|ship|courier|send)\s+(it|the\s+(device|unit|battery|power\s+station|product))\s+back\b
    - \buse\s+the\s+(standard\s+)?(prepaid\s+)?return\s+label\b.{0,60}\b(battery|power\s*cell|power\s+station|overheat|swollen)
    severity: critical
    policy_refs:
    - SAF-POL-10:5.2
    - RPL-POL-03:6.1
  - code: UNSUPPORTED_DELIVERY_DEADLINE
    name: Promising a delivery date not confirmed by the carrier
    patterns:
    - \b(will|shall)\s+(definitely\s+|certainly\s+)?(arrive|be\s+delivered|reach\s+you)\s+(by|on|tomorrow|today|within)\b
    - \bguarantee[ds]?\b.{0,30}\bdeliver
    severity: major
    policy_refs:
    - DEL-POL-04:5.1
  - code: DISMISS_SAFETY_CONCERN
    name: Dismissing or minimising a safety concern
    patterns:
    - \b(nothing|no\s+need)\s+to\s+worry\b
    - \b(it\s+is|it's)\s+(completely\s+|perfectly\s+)?(normal|safe)\s+(for|to|that)\b.{0,40}\b(hot|heat|smoke|spark|smell)
    - \bcontinue\s+(using|to\s+use)\s+(it|the\s+(device|product|unit))
    severity: critical
    policy_refs:
    - SAF-POL-10:7.2
  - code: DISCLOSE_OTHER_CUSTOMER_DATA
    name: Disclosing another customer's personal data
    patterns:
    - \bthe\s+other\s+customer'?s?\s+(name|email|address|phone)\s+is\b
    severity: critical
    policy_refs:
    - PRV-POL-08:8
  - code: PROMISE_REGULATORY_OUTCOME
    name: Promising a regulatory or legal outcome
    patterns:
    - \b(no|won't\s+be\s+any)\s+(legal|regulatory)\s+(action|consequences)\b
    - \bsettle(ment)?\s+(offer|amount)\b
    severity: major
    policy_refs:
    - PRV-POL-08:8
    - CMP-GDL-19:3.4
  - code: CLOSE_WITHOUT_RESOLUTION
    name: Closing a complaint without a resolution path
    patterns:
    - \b(there\s+is\s+)?nothing\s+(more\s+)?(we|i)\s+can\s+do\b
    - \bthis\s+(case|complaint|ticket)\s+is\s+(now\s+)?closed\b
    severity: major
    policy_refs:
    - CHP-POL-01:8.1
