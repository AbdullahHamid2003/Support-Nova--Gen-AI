priority_rules:
  principles:
  - name: Sentiment neutrality
    rule_id: URG-100
    description: Sentiment and emotion indicators never raise urgency or priority.
      An AI urgency above the rule urgency with no risk signal is flagged as 'urgency
      inflated by emotional language'.
    policy_refs:
    - CHP-POL-01:5.2
    - SLA-RUL-15:5.4
  - name: Customer-type neutrality
    rule_id: URG-101
    description: Customer type (including VIP) never changes urgency or priority.
    policy_refs:
    - SLA-RUL-15:5.4
  - name: Calm critical complaints
    rule_id: URG-102
    description: Risk signals set urgency floors regardless of calm wording; an AI
      urgency below the floor is a critical validation failure.
    policy_refs:
    - CHP-POL-01:5.2
    - SLA-RUL-15:5.1
  impact_levels:
  - Low
  - Medium
  - High
  urgency_levels:
  - Low
  - Medium
  - High
  - Critical
  priority_levels:
  - code: P3
    name: P3 - Low
  - code: P2
    name: P2 - Medium
  - code: P1
    name: P1 - High
  - code: P0
    name: P0 - Critical
  priority_matrix:
    Low:
      Low: P3
      High: P2
      Medium: P3
    High:
      Low: P2
      High: P1
      Medium: P2
    Medium:
      Low: P3
      High: P2
      Medium: P2
    Critical:
      Low: P1
      High: P0
      Medium: P0
    policy_ref: SLA-RUL-15:4
  urgency_floors:
  - name: Fire
    when:
      signal: fire_event
    impact: High
    rule_id: URG-001
    urgency: Critical
    policy_refs:
    - SLA-RUL-15:5.1
    - SAF-POL-10:3
    smoke or explosion: null
    is_active: true
  - name: Overheating or battery hazard
    when:
      signal: overheating
    impact: High
    rule_id: URG-002
    urgency: Critical
    policy_refs:
    - SLA-RUL-15:5.1
    - SAF-POL-10:3
    is_active: true
  - name: Electrical hazard
    when:
      signal: electrical_hazard
    impact: High
    rule_id: URG-003
    urgency: Critical
    policy_refs:
    - SLA-RUL-15:5.1
    - SAF-POL-10:3
    is_active: true
  - name: Injury
    when:
      signal: injury
    impact: High
    rule_id: URG-004
    urgency: Critical
    policy_refs:
    - SLA-RUL-15:5.1
    is_active: true
  - name: Account compromise
    when:
      signal: security_breach
    impact: High
    rule_id: URG-005
    urgency: Critical
    policy_refs:
    - SLA-RUL-15:5.1
    - SEC-POL-09:4.3
    is_active: true
  - name: Physical home security compromised
    when:
      signal: lock_security
    impact: High
    rule_id: URG-006
    urgency: Critical
    policy_refs:
    - SLA-RUL-15:5.1
    - SEC-POL-09:5.1
    is_active: true
  - name: Privacy exposure
    when:
      signal: privacy_breach
    impact: High
    rule_id: URG-007
    urgency: High
    policy_refs:
    - SLA-RUL-15:5.2
    - PRV-POL-08:7.1
    is_active: true
  - name: Legal threat
    when:
      signal: legal_threat
    impact: Medium
    rule_id: URG-008
    urgency: High
    policy_refs:
    - SLA-RUL-15:5.2
    - CMP-GDL-19:3
    is_active: true
  - name: Critical impact on the home
    when:
      signal: critical_impact
    impact: High
    rule_id: URG-009
    urgency: High
    policy_refs:
    - SLA-RUL-15:5.2
    - ESC-SOP-12:4.8
    is_active: true
  - name: Vulnerable person with critical impact
    when:
      all:
      - signal: vulnerable_customer
      - signal: critical_impact
    impact: High
    rule_id: URG-010
    urgency: Critical
    policy_refs:
    - ESC-SOP-12:4.8
    - CMP-GDL-19:5.2
    is_active: true
  - name: Repeat unresolved complaint
    when:
      op: gte
      fact: history.unresolved_prior_same_issue
      value: $param:repeat_supervisor_threshold
    impact: Medium
    rule_id: URG-011
    urgency: High
    policy_refs:
    - SLA-RUL-15:5.2
    - ESC-SOP-12:4.5
    is_active: true
  - name: High financial impact
    when:
      op: gte
      fact: complaint.max_amount
      value: $param:high_value_supervisor_usd
    impact: High
    rule_id: URG-012
    policy_refs:
    - SLA-RUL-15:6
    is_active: true
  - name: Severe service failure
    when:
      signal: severe_service_failure
    impact: High
    rule_id: URG-013
    urgency: High
    policy_refs:
    - SLA-RUL-15:5.2
    - ESC-SOP-12:4.7
    is_active: true
  - name: Fraudulent payment
    when:
      signal: fraud
    impact: High
    rule_id: URG-014
    urgency: High
    policy_refs:
    - SLA-RUL-15:5.2
    - ESC-SOP-12:4.2
    is_active: true
  - name: Staff harassment or discrimination
    when:
      signal: staff_harassment
    impact: Medium
    rule_id: URG-015
    urgency: High
    policy_refs:
    - ESC-SOP-12:4.10
    is_active: true
missing_info_rules:
  never_block_categories:
  - SAF
  - PRV
  never_block_subcategories:
  - ACC-UNA
  missing_info_rules:
  - when:
      all:
      - op: eq
        fact: complaint.has_order_reference
        value: false
      - op: eq
        fact: complaint.has_transaction_reference
        value: false
      - any:
        - category_in:
          - PRD
          - DEL
          - REF
          - WAR
        - subcategory_in:
          - BIL-DUP
          - BIL-INC
          - BIL-CAN
    field: order_reference
    label: Missing order number
    rule_id: MIS-001
    blocking: true
    keywords:
    - order
    - reference
    - number
    - lmr
    question: Ask for the order reference (format LMR-######) of the affected order.
    policy_refs:
    - CHP-POL-01:4.2
    - REF-POL-02:4.1
    is_active: true
  - when:
      all:
      - category_in:
        - BIL
      - op: eq
        fact: complaint.has_transaction_reference
        value: false
      - op: eq
        fact: complaint.has_order_reference
        value: false
      - op: eq
        fact: complaint.has_date
        value: false
    field: transaction_reference
    label: Missing transaction reference or charge date
    rule_id: MIS-002
    blocking: true
    keywords:
    - transaction
    - charge
    - date
    - amount
    - statement
    question: Ask for the transaction reference (TXN-########) or the date and amount
      of the charge.
    policy_refs:
    - BIL-POL-05:4.1
    - BIL-POL-05:4.2
    is_active: true
  - when:
      all:
      - op: eq
        fact: complaint.has_product
        value: false
      - category_in:
        - PRD
        - TEC
        - WAR
        - SAF
    field: product
    label: Missing product
    rule_id: MIS-003
    blocking: false
    keywords:
    - product
    - device
    - model
    - which
    question: Ask which Lumora product or model is affected.
    policy_refs:
    - CHP-POL-01:4.2
    is_active: true
  - when:
      all:
      - subcategory_in:
        - PRD-DOA
        - DEL-WRG
      - op: eq
        fact: complaint.has_photo_evidence
        value: false
    field: photo_evidence
    label: Missing evidence
    rule_id: MIS-004
    blocking: true
    keywords:
    - photo
    - photos
    - picture
    - pictures
    - image
    - evidence
    question: Ask for photos of the product and the packaging.
    policy_refs:
    - RPL-POL-03:3.1
    is_active: true
  - when:
      any:
      - op: lt
        fact: complaint.word_count
        value: $param:min_description_words
      - op: lt
        fact: classification.score
        value: 3.0
    field: problem_description
    label: Missing problem description
    rule_id: MIS-005
    blocking: true
    keywords:
    - describe
    - what happened
    - details
    - explain
    - more information
    question: Ask the customer to describe what happened, when it started and what
      they expected.
    policy_refs:
    - CHP-POL-01:4.2
    - CHP-SOP-13:5
    is_active: true
  - when:
      all:
      - subcategory_in:
        - WAR-CLM
        - REF-REQ
        - PRD-MAL
      - op: eq
        fact: complaint.has_order_reference
        value: false
      - op: eq
        fact: complaint.has_date
        value: false
    field: transaction_date
    label: Missing transaction date
    rule_id: MIS-006
    blocking: true
    keywords:
    - date
    - when
    - purchase
    - bought
    - delivered
    question: Ask for the purchase or delivery date (or the order reference).
    policy_refs:
    - WAR-POL-07:4.1
    - REF-POL-02:3.1
    is_active: true
  - when:
      all:
      - op: eq
        fact: complaint.has_order_reference
        value: true
      - op: eq
        fact: order.exists
        value: false
    field: order_reference_unverified
    label: Order reference could not be verified
    rule_id: MIS-007
    blocking: true
    keywords:
    - confirm
    - order
    - reference
    - could not find
    - check
    question: Ask the customer to confirm the order reference because it could not
      be found.
    policy_refs:
    - REF-POL-02:4.1
    is_active: true
  - when:
      all:
      - op: eq
        fact: order.exists
        value: true
      - op: eq
        fact: order.belongs_to_customer
        value: false
    field: order_ownership
    label: Order reference does not match the customer account
    rule_id: MIS-008
    blocking: true
    keywords:
    - confirm
    - email
    - order
    - account
    question: Ask the customer to confirm the order reference and the email address
      used for the order (do not disclose order details).
    policy_refs:
    - SEC-POL-09:6
    - PRV-POL-08:8
    is_active: true
followup_rules:
  follow_up_types:
  - Request for additional information
  - Resolution confirmation
  - Refund-status update
  - Replacement-status update
  - Escalation acknowledgement
  - Closure confirmation
  followup_rules:
  - name: Blocking missing information
    type: Request for additional information
    when:
      op: eq
      fact: case.has_blocking_missing_info
      value: true
    rule_id: FUP-001
    due_hours: 24
    policy_refs:
    - CHP-SOP-13:5
    - CHP-SOP-13:8
    overrides_rule_follow_up: true
    is_active: true
  - name: Escalated complaint
    type: Escalation acknowledgement
    when:
      op: gte
      fact: case.escalation_rank
      value: 1
    rule_id: FUP-002
    due_hours: sla_first_response
    policy_refs:
    - ESC-SOP-12:6
    - CHP-SOP-13:8
    overrides_rule_follow_up: false
    is_active: true
  - name: Resolved complaint
    type: Closure confirmation
    when:
      op: eq
      fact: case.status
      value: Resolved
    rule_id: FUP-003
    due_hours: 48
    policy_refs:
    - CHP-POL-01:8.1
    overrides_rule_follow_up: true
    is_active: true
  - name: Rule-defined follow-up
    type: $rule
    when:
      op: eq
      fact: case.rule_follow_up_required
      value: true
    rule_id: FUP-004
    due_hours: $rule
    policy_refs:
    - CHP-SOP-13:3.8
    overrides_rule_follow_up: false
    is_active: true
response_rules:
  tone_rules:
  - tone: concise
    check: max_words
    value: 120
    rule_id: RSP-101
    severity: minor
    policy_refs:
    - TPL-COM-18:9
  - tone: formal
    check: no_contractions
    rule_id: RSP-102
    severity: minor
    policy_refs:
    - TPL-COM-18:9
  - tone: formal
    check: formal_salutation
    rule_id: RSP-103
    severity: minor
    policy_refs:
    - TPL-COM-18:9
  - tone: empathetic
    check: min_empathy_markers
    value: 2
    rule_id: RSP-104
    severity: minor
    policy_refs:
    - TPL-COM-18:9
  - tone: '*'
    check: professional_language
    rule_id: RSP-105
    severity: major
    policy_refs:
    - CHP-SOP-13:4
  - tone: '*'
    check: max_words
    value: 320
    rule_id: RSP-106
    severity: minor
    policy_refs:
    - CHP-SOP-13:4
  number_words:
    one: 1
    six: 6
    ten: 10
    two: 2
    five: 5
    four: 4
    nine: 9
    eight: 8
    seven: 7
    three: 3
    thirty: 30
    fourteen: 14
    forty eight: 48
    forty-eight: 48
    seventy two: 72
    seventy-two: 72
    twenty four: 24
    twenty-four: 24
  amount_pattern: (\$|usd\s?)\s?(\d{1,3}(,\d{3})*(\.\d{2})?|\d+(\.\d{2})?)
  required_elements:
  - name: Acknowledges the complaint
    element: acknowledgement
    rule_id: RSP-001
    patterns:
    - \b(thank\s+you|thanks)\s+(for|you)\b
    - \bwe\s+(have\s+)?(received|reviewed|looked\s+into)\b
    - \b(regarding|about|concerning)\s+your\s+(complaint|message|request|order|case|report)\b
    - \bi\s+(am|'m)\s+writing\s+(to|about|regarding)\b
    - \bwe\s+acknowledge\b
    severity: major
    policy_refs:
    - CHP-SOP-13:4
  - name: Shows appropriate empathy
    element: empathy
    rule_id: RSP-002
    patterns:
    - \b(sorry|apologi[sz]e|apologies|regret)\b
    - \bunderstand\s+(how|that|your|this)\b
    - \b(frustrating|inconvenien(t|ce)|concerning|stressful|worrying|upsetting)\b
    - \bappreciate\s+your\s+(patience|understanding)\b
    severity: minor
    policy_refs:
    - CHP-SOP-13:4
  - name: Summarises the issue
    method: overlap
    element: issue_summary
    rule_id: RSP-003
    severity: minor
    policy_refs:
    - CHP-SOP-13:4
    min_key_terms: 2
  - name: Explains the next step
    element: next_step
    rule_id: RSP-004
    patterns:
    - \b(next\s+step|what\s+happens\s+next|we\s+will|we'll|our\s+(team|specialists?|department)\s+will|you\s+will\s+(receive|hear)|please\s+(reply|send|provide|share|confirm|stop|do\s+not))\b
    severity: major
    policy_refs:
    - CHP-SOP-13:4
  timeline_patterns:
    deadline: \b(by\s+(tomorrow|today|tonight|monday|tuesday|wednesday|thursday|friday|saturday|sunday|end\s+of\s+(the\s+)?(day|week))|tomorrow|today|within\s+the\s+hour|right\s+away|immediately)\b
    duration: \b(within|in|up\s+to|over\s+the\s+next|no\s+later\s+than|inside)\s+(\d{1,3}|one|two|three|four|five|six|seven|eight|nine|ten|fourteen|thirty|twenty[-
      ]four|forty[- ]eight|seventy[- ]two)\s+(business\s+|working\s+|calendar\s+)?(hours?|days?|weeks?)\b
  formal_salutations:
  - ^\s*dear\b
  - ^\s*(good\s+(morning|afternoon|evening))\b
  contraction_pattern: \b\w+'(s|re|ve|ll|d|t|m)\b
  unprofessional_patterns:
  - '!{2,}'
  - \b(lol|omg|wtf|dude|gonna|wanna|ain't|chill)\b
  - '[\U0001F300-\U0001FAFF]'
  - \b(stupid|idiot|dumb|shut\s+up)\b
  deadline_allowed_context: \b(stop\s+using|unplug|disconnect|contact\s+us|call\s+us|reply|keep\s+(it|the\s+device)\s+away|do\s+not\s+use)\b
