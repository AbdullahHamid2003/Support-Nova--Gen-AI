    add_supporting:
    - DEPT-MGT
    is_active: true
  - name: Safety signal outside Safety category adds Product Safety
    when:
      any_signal:
      - fire_event
      - overheating
      - electrical_hazard
      - injury
    rule_id: RTE-105
    policy_refs:
    - RTE-RUL-14:4
    add_supporting:
    - DEPT-SAF
    is_active: true
  - name: Secondary issues add their primary department
    when:
      secondary_issues: true
    rule_id: RTE-106
    policy_refs:
    - RTE-RUL-14:4.1
    add_supporting:
    - $secondary_primary_departments
    is_active: true
escalation_rules:
  levels:
  - name: No Escalation
    rank: 0
    action_code: null
  - name: Supervisor Review
    rank: 1
    action_code: ESCALATE_SUPERVISOR
  - name: Department Manager
    rank: 2
    action_code: ESCALATE_DEPARTMENT_MANAGER
  - name: Specialist Team
    rank: 3
    action_code: ESCALATE_SPECIALIST_TEAM
  - name: Compliance Review
    rank: 4
    action_code: ESCALATE_COMPLIANCE
  - name: Critical Management Escalation
    rank: 5
    action_code: ESCALATE_CRITICAL_MANAGEMENT
  escalation_notes_requirements:
    policy_ref: ESC-SOP-12:5
    required_fields:
    - summary
    - key_facts
    - reason
    - actions_taken
    - relevant_policy
    - required_next_action
  escalation_rules:
  - name: Fire
    when:
      signal: fire_event
    level: Critical Management Escalation
    reason: Product fire, smoke or explosion reported.
    rule_id: ESC-001
    trigger: safety
    departments:
    - DEPT-SAF
    - DEPT-MGT
    policy_refs:
    - ESC-SOP-12:4.1
    - SAF-POL-10:4.4
    smoke or explosion: null
    is_active: true
  - name: Overheating or battery swelling
    when:
      signal: overheating
    level: Specialist Team
    reason: Overheating or battery hazard reported.
    rule_id: ESC-002
    trigger: safety
    departments:
    - DEPT-SAF
    policy_refs:
    - ESC-SOP-12:4.1
    - SAF-POL-10:4.4
    is_active: true
  - name: Sparks or electric shock
    when:
      signal: electrical_hazard
    level: Specialist Team
    reason: Electrical hazard reported.
    rule_id: ESC-003
    trigger: safety
    departments:
    - DEPT-SAF
    policy_refs:
    - ESC-SOP-12:4.1
    - SAF-POL-10:4.4
    is_active: true
  - name: Injury reported
    when:
      signal: injury
    level: Critical Management Escalation
    reason: A person was injured by a product.
    rule_id: ESC-004
    trigger: safety
    departments:
    - DEPT-SAF
    - DEPT-MGT
    - DEPT-CMP
    policy_refs:
    - ESC-SOP-12:4.1
    - SAF-POL-10:7.3
    is_active: true
  - name: Child involved in a safety incident
    when:
      all:
      - signal: child_involved
      - any_signal:
        - fire_event
        - overheating
        - electrical_hazard
        - injury
    level: Critical Management Escalation
    reason: Safety incident involving a child.
    rule_id: ESC-005
    trigger: safety
    departments:
    - DEPT-SAF
    - DEPT-MGT
    policy_refs:
    - ESC-SOP-12:4.1
    - SAF-POL-10:4.4
    is_active: true
  - name: Recall-related complaint
    when:
      signal: recall_mention
    level: Specialist Team
    reason: Complaint references a product recall.
    rule_id: ESC-006
    trigger: safety
    departments:
    - DEPT-SAF
    policy_refs:
    - ESC-SOP-12:4.14
    - SAF-POL-10:8.1
    is_active: true
  - name: Safety subcategory without explicit hazard terms
    when:
      subcategory_in:
      - SAF-OVH
      - SAF-ELC
    level: Specialist Team
    reason: Complaint classified as a product safety hazard.
    rule_id: ESC-007
    trigger: safety
    departments:
    - DEPT-SAF
    policy_refs:
    - ESC-SOP-12:4.1
    is_active: true
  - name: Injury subcategory
    when:
      subcategory_in:
      - SAF-INJ
    level: Critical Management Escalation
    reason: Complaint classified as an injury incident.
    rule_id: ESC-008
    trigger: safety
    departments:
    - DEPT-SAF
    - DEPT-MGT
    - DEPT-CMP
    policy_refs:
    - ESC-SOP-12:4.1
    - SAF-POL-10:4.4
    is_active: true
  - name: Unauthorized account access
    when:
      any:
      - signal: security_breach
      - subcategory_in:
        - ACC-UNA
    level: Specialist Team
    reason: Suspected unauthorized access or account takeover.
    rule_id: ESC-009
    trigger: security
    departments:
    - DEPT-SEC
    policy_refs:
    - ESC-SOP-12:4.2
    - SEC-POL-09:4.3
    is_active: true
  - name: Smart-lock unexplained unlock
    when:
      signal: lock_security
    level: Critical Management Escalation
    reason: Physical home security compromised (unexplained smart-lock event).
    rule_id: ESC-010
    trigger: security
    departments:
    - DEPT-SEC
    - DEPT-MGT
    policy_refs:
    - ESC-SOP-12:4.2
    - SEC-POL-09:5.3
    is_active: true
  - name: Fraudulent payment
    when:
      signal: fraud
    level: Specialist Team
    reason: Suspected fraudulent payment activity.
    rule_id: ESC-011
    trigger: security
    departments:
    - DEPT-SEC
    - DEPT-BIL
    policy_refs:
    - ESC-SOP-12:4.2
    - BIL-POL-05:9
    is_active: true
  - name: Personal data or footage exposed
    when:
      any:
      - signal: privacy_breach
      - subcategory_in:
        - PRV-BRC
    level: Compliance Review
    reason: Possible exposure of personal data or footage (privacy incident).
    rule_id: ESC-012
    trigger: privacy
    departments:
    - DEPT-CMP
    policy_refs:
    - ESC-SOP-12:4.3
    - PRV-POL-08:7.2
    is_active: true
  - name: Data shared or sold without consent
    when:
      all:
      - signal: consent_violation
      - text_matches: \b(sold|selling|shared|sharing|passed|gave)\b.{0,40}\b(data|information|details|email|number)\b|\bthird[-
          ]part(y|ies)\b|\bpartners?\b
    level: Compliance Review
    reason: Personal data reportedly shared without consent.
    rule_id: ESC-013
    trigger: privacy
    departments:
    - DEPT-CMP
    policy_refs:
    - ESC-SOP-12:4.3
    - PRV-POL-08:5.3
    is_active: true
  - name: Overdue data-rights request
    when:
      all:
      - any:
        - signal: data_rights_request
        - subcategory_in:
          - PRV-DSR
      - op: gt
        fact: complaint.max_elapsed_days
        value: $param:dsar_fulfilment_days
    level: Compliance Review
    reason: Data-rights request overdue beyond the 30-day limit.
    rule_id: ESC-014
    trigger: privacy
    departments:
    - DEPT-CMP
    policy_refs:
    - ESC-SOP-12:4.3
    - PRV-POL-08:4.3
    is_active: true
  - name: Children's data involved
    when:
      all:
      - signal: minors_data
      - any:
        - category_in:
          - PRV
        - any_signal:
          - privacy_breach
          - consent_violation
    level: Compliance Review
    reason: Privacy matter involving children's data.
    rule_id: ESC-015
    trigger: privacy
    departments:
    - DEPT-CMP
    policy_refs:
    - ESC-SOP-12:4.3
    is_active: true
  - name: Legal threat or regulator mention
    when:
      signal: legal_threat
    level: Compliance Review
    reason: Customer threatens legal action or refers to a regulator.
    rule_id: ESC-016
    trigger: legal
    departments:
    - DEPT-CMP
    policy_refs:
    - ESC-SOP-12:4.4
    - CMP-GDL-19:3.2
    is_active: true
  - name: Repeat unresolved complaint (2 prior)
    when:
      op: gte
      fact: history.unresolved_prior_same_issue
      value: $param:repeat_supervisor_threshold
    level: Supervisor Review
    reason: Repeat complaint with prior unresolved complaints on the same issue.
    rule_id: ESC-017
    trigger: repeat
    departments:
    - $primary_department
    policy_refs:
    - ESC-SOP-12:4.5
    - CHP-POL-01:7.2
    is_active: true
  - name: Repeat unresolved complaint (3+ prior)
    when:
      op: gte
      fact: history.unresolved_prior_same_issue
      value: $param:repeat_manager_threshold
    level: Department Manager
    reason: Three or more prior unresolved complaints on the same issue.
    rule_id: ESC-018
    trigger: repeat
    departments:
    - $primary_department
    - DEPT-MGT
    policy_refs:
    - ESC-SOP-12:4.5
    is_active: true
  - name: Reopened complaint
    when:
      op: eq
      fact: history.references_resolved_complaint
      value: true
    level: Supervisor Review
    reason: Complaint reopens a previously resolved complaint (failed resolution).
    rule_id: ESC-019
    trigger: repeat
    departments:
    - $primary_department
    policy_refs:
    - ESC-SOP-12:4.5
    - CHP-POL-01:8.2
    is_active: true
  - name: High-value dispute (USD 500+)
    when:
      op: gte
      fact: case.claimed_amount
      value: $param:high_value_supervisor_usd
    level: Supervisor Review
    reason: Disputed or claimed amount of USD 500 or more.
    rule_id: ESC-020
    trigger: high_value
    departments:
    - $primary_department
    policy_refs:
    - ESC-SOP-12:4.6
    is_active: true
  - name: High-value dispute (USD 1
    when:
      op: gte
      fact: case.claimed_amount
      value: $param:high_value_manager_usd
    500+): null
    level: Department Manager
    reason: Disputed or claimed amount of USD 1,500 or more.
    rule_id: ESC-021
    trigger: high_value
    departments:
    - $primary_department
    - DEPT-MGT
    policy_refs:
    - ESC-SOP-12:4.6
    is_active: true
  - name: High-value business account order
    when:
      all:
      - op: eq
        fact: complaint.customer_type
        value: business
      - op: gte
        fact: order.order_total
        value: $param:business_high_value_usd
    level: Department Manager
    reason: Business-account order of USD 2,500 or more affected.
    rule_id: ESC-022
    trigger: high_value
    departments:
    - $primary_department
    - DEPT-MGT
    policy_refs:
    - ESC-SOP-12:4.6
    is_active: true
  - name: High-value lost order
    when:
      all:
      - subcategory_in:
        - DEL-LST
      - op: gte
        fact: order.order_total
        value: $param:high_value_supervisor_usd
    level: Supervisor Review
    reason: Lost order valued at USD 500 or more requires Supervisor Review.
    rule_id: ESC-023
    trigger: high_value
    departments:
    - DEPT-LOG
    policy_refs:
    - DEL-POL-04:6.3
    - ESC-SOP-12:4.6
    is_active: true
  - name: Severe service failure
    when:
      signal: severe_service_failure
    level: Department Manager
    reason: Service outage causing lost recordings or disabled home security.
    rule_id: ESC-024
    trigger: service_failure
    departments:
    - DEPT-TEC
    - DEPT-MGT
    policy_refs:
    - ESC-SOP-12:4.7
    is_active: true
  - name: Critical customer impact
    when:
      signal: critical_impact
    level: Specialist Team
    reason: Critical impact on the customer's home (locked out, no heating/cooling,
      medical dependence).
    rule_id: ESC-025
    trigger: critical_impact
    departments:
    - $primary_department
    policy_refs:
    - ESC-SOP-12:4.8
    is_active: true
  - name: Vulnerable person with critical impact
    when:
      all:
      - signal: vulnerable_customer
      - signal: critical_impact
    level: Critical Management Escalation
    reason: Critical impact affecting a vulnerable person.
    rule_id: ESC-026
    trigger: critical_impact
    departments:
    - $primary_department
    - DEPT-MGT
    policy_refs:
    - ESC-SOP-12:4.8
    - CMP-GDL-19:5.2
    is_active: true
  - name: Policy exception requested
    when:
      signal: policy_exception_request
    level: Supervisor Review
    reason: Customer requests an outcome outside policy limits or windows.
    rule_id: ESC-027
    trigger: policy_exception
    departments:
    - $primary_department
    policy_refs:
    - ESC-SOP-12:4.9
    - REF-POL-02:7.1
    is_active: true
  - name: Refund requested outside the refund window
    when:
      all:
      - any:
        - signal: refund_request
        - op: eq
          fact: complaint.requested_resolution
          value: refund
      - op: eq
        fact: eligibility.within_refund_window
        value: false
      - category_in:
        - REF
        - PRD
        - DEL
    level: Supervisor Review
    reason: Refund requested outside the eligibility window (policy exception).
    rule_id: ESC-028
    trigger: policy_exception
    departments:
    - DEPT-RET
    policy_refs:
    - ESC-SOP-12:4.9
    - REF-POL-02:7.1
    is_active: true
  - name: Compensation above agent limit
    when:
      op: gt
      fact: complaint.requested_compensation_amount
      value: $param:agent_compensation_limit_usd
    level: Supervisor Review
    reason: Requested compensation exceeds the agent approval limit.
    rule_id: ESC-029
    trigger: policy_exception
    departments:
    - $primary_department
    policy_refs:
    - ESC-SOP-12:4.9
    - CPN-POL-11:5.1
    is_active: true
  - name: Compensation above supervisor limit
    when:
      op: gt
      fact: complaint.requested_compensation_amount
      value: $param:supervisor_compensation_limit_usd
    level: Department Manager
    reason: Requested compensation exceeds the supervisor approval limit.
    rule_id: ESC-030
    trigger: policy_exception
    departments:
    - $primary_department
    policy_refs:
    - ESC-SOP-12:4.9
    - CPN-POL-11:5.2
    is_active: true
  - name: Late billing dispute
    when:
      all:
      - category_in:
        - BIL
      - op: eq
        fact: eligibility.within_dispute_window
        value: false
    level: Supervisor Review
    reason: Billing dispute raised more than 60 days after the charge.
    rule_id: ESC-031
    trigger: policy_exception
    departments:
    - DEPT-BIL
    policy_refs:
    - BIL-POL-05:4.3
    is_active: true
  - name: Staff harassment
    when:
      signal: staff_harassment
    level: Compliance Review
    reason: Serious staff misconduct reported (harassment, discrimination or threats).
    rule_id: ESC-032
    trigger: staff
    departments:
    - DEPT-CMP
    - DEPT-MGT
    policy_refs:
    - ESC-SOP-12:4.10
    - STF-POL-21:6
    discrimination or threats: null
    is_active: true
  - name: Technician property damage or theft
    when:
      any:
      - signal: technician_damage_theft
      - subcategory_in:
        - STF-MIS
    level: Department Manager
    reason: Property damage or theft allegation against a technician.
    rule_id: ESC-033
    trigger: staff
    departments:
    - DEPT-CRL
    - DEPT-MGT
    policy_refs:
    - ESC-SOP-12:4.10
    - INS-POL-24:6.2
    is_active: true
  - name: Staff commitment outside policy
    when:
      all:
      - subcategory_in:
        - STF-MIN
      - text_matches: \b(promised|assured|guaranteed|told\s+me\s+(i|we)\s+would|said\s+(i|we)\s+would)\b
    level: Supervisor Review
    reason: Staff member made a commitment that must be checked against policy.
    rule_id: ESC-034
    trigger: staff
    departments:
    - DEPT-CRL
    policy_refs:
    - STF-POL-21:4.2
    is_active: true
  - name: Public media threat
    when:
      signal: media_threat
    level: Supervisor Review
    reason: Customer threatens public or media exposure.
    rule_id: ESC-035
    trigger: reputational
    departments:
    - DEPT-CRL
    policy_refs:
    - ESC-SOP-12:4.12
    is_active: true
  - name: Chargeback threat
    when:
      signal: chargeback_threat
    level: Supervisor Review
    reason: Customer mentions a chargeback or bank dispute.
    rule_id: ESC-036
    trigger: reputational
    departments:
    - DEPT-BIL
    policy_refs:
    - ESC-SOP-12:4.12
    - BIL-POL-05:7.1
    is_active: true
  - name: Replacement also defective
    when:
      any:
      - signal: replacement_failed
      - op: eq
        fact: eligibility.replacement_limit_reached
        value: true
    level: Supervisor Review
    reason: The replacement product is also defective.
    rule_id: ESC-037
    trigger: replacement_failure
    departments:
    - DEPT-WAR
    - DEPT-RET
    policy_refs:
    - ESC-SOP-12:4.13
    - RPL-POL-03:3.4
    is_active: true
  - name: Warranty denial appeal
    when:
      subcategory_in:
      - WAR-DEN
    level: Supervisor Review
    reason: Warranty denial appeals are reviewed by a Warranty Services supervisor.
    rule_id: ESC-038
    trigger: warranty_appeal
    departments:
    - DEPT-WAR
    policy_refs:
    - WAR-POL-07:7.2
    is_active: true
  - name: SLA breach on P0/P1
    when:
      all:
      - op: eq
        fact: sla.breached
        value: true
      - op: in
        fact: case.priority
        value:
        - P0
        - P1
    level: Department Manager
    reason: SLA breached on a P0/P1 complaint.
    rule_id: ESC-039
    trigger: sla
    departments:
    - $primary_department
    - DEPT-MGT
    policy_refs:
    - ESC-SOP-12:4.11
    - SLA-RUL-15:7.2
    runtime_only: true
    is_active: true
sla_rules:
  states:
  - On Track
  - At Risk
  - Breached
  - Met
  at_risk_param: sla_at_risk_pct
  sla_rules:
  - rule_id: SLA-P0
    priority: P0
    policy_refs:
    - SLA-RUL-15:3.1
    resolution_hours: 24
    first_response_hours: 1
    is_active: true
  - rule_id: SLA-P1
    priority: P1
    policy_refs:
    - SLA-RUL-15:3.2
    resolution_hours: 48
    first_response_hours: 4
    is_active: true
  - rule_id: SLA-P2
    priority: P2
    policy_refs:
    - SLA-RUL-15:3.3
    resolution_hours: 120
    first_response_hours: 24
    is_active: true
  - rule_id: SLA-P3
    priority: P3
    policy_refs:
    - SLA-RUL-15:3.4
    resolution_hours: 240
    first_response_hours: 48
    is_active: true
precedence_rules:
  fact_keys:
  - key: refund_issue_time
    topic: refunds
    pattern: \brefunds?\b.{0,60}\b(issued|processed|paid)\b.{0,40}\bwithin\s+(?P<value>\d+)\s+(business\s+|calendar\s+)?days?
  - key: refund_window_days
    topic: refunds
    pattern: \b(return|refund)\w*\b.{0,60}\bwithin\s+(?P<value>\d+)\s+(calendar\s+)?days?\s+of\s+(the\s+)?delivery
  - key: delay_credit_usd
    topic: delivery
    pattern: \bdelay\w*\b.{0,160}?\b(usd\s?|\$)(?P<value>\d+)\s+store\s+credit
  - key: agent_compensation_limit_usd
    topic: compensation
    pattern: \bagents?\b.{0,80}?\b(up\s+to|of)\s+(usd\s?|\$)(?P<value>\d+)
  - key: duplicate_reversal
    topic: billing
    pattern: \bduplicate\b.{0,100}?\breversed\s+(?P<value>immediately|within\s+\d+\s+business\s+days)
  doc_type_rank:
    faq: 4
    sop: 2
    rules: 1
    policy: 1
    template: 5
    guideline: 3
  precedence_rules:
  - name: Active documents only
    rule_id: PRC-001
    description: Only Active documents within their effective and expiry dates can
      be primary evidence.
    policy_refs:
    - CHP-POL-01:10.1
  - name: Precedence by document type
    rule_id: PRC-002
    description: Policy = Rules > SOP > Guideline > FAQ > Template.
    policy_refs:
    - CHP-POL-01:10.2
  - name: Precedence by effective date
    rule_id: PRC-003
    description: 'Same type and topic: the most recent effective date prevails.'
    policy_refs:
    - CHP-POL-01:10.3
  - name: Outdated documents
    rule_id: PRC-004
    description: Previous, Superseded, Draft, expired or not-yet-effective documents
      are never primary; shown as Outdated.
    policy_refs:
    - CHP-POL-01:10.4
  - name: Conflict handling
    rule_id: PRC-005
    description: Conflicting statements are resolved by PRC-002/PRC-003 and reported
      to the document owner.
    policy_refs:
    - CHP-POL-01:10.5
