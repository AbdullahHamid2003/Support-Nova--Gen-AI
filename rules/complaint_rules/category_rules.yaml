# =============================================================================
# Complaint-category rules (CAT-*). Deterministic classification used by the
# Python Ground-Truth Validation Pipeline to derive its OWN expected category /
# subcategory, independently of the GenAI output (SRS Pipeline 2: "complaint-
# category rules"; Steps 14, 15, 23).
#
# score(subcategory) = sum(weights of distinct matched terms; title matches x1.3)
#                    + signal_boosts + product_boosts - negative terms
# Primary issue  = highest score, except that a subcategory in a higher
#                  routing-precedence group (RTE-RUL-14 s5) wins when its score
#                  >= precedence_min_score (risk first, CHP-POL-01 s3.2).
# Secondary      = other subcategories with score >= secondary_min_score and
#                  >= secondary_ratio x primary score.
# Ambiguous      = top-2 in different categories within ambiguity_margin.
# New subcategories can be added here (or via Admin > Rule Matrix) without code.
# =============================================================================
settings:
  title_multiplier: 1.3
  min_score: 3.0               # below this -> "insufficient information to classify"
  precedence_min_score: 4.0
  secondary_min_score: 4.0
  secondary_ratio: 0.35
  secondary_strong_score: 5.0  # a secondary issue this strong is kept whatever the primary score
  ambiguity_margin: 0.15       # relative gap between top-2 scores
  max_secondary: 3

