    prohibited_actions: [PROMISE_REFUND_BEFORE_VERIFICATION, SHIP_REPLACEMENT]
    eligibility: {refund: requires_verification, replacement: not_eligible, compensation: not_applicable}
    escalation: Supervisor Review
    follow_up: {required: true, type: Resolution confirmation, due_hours: 72}
    timelines: []
    policy_refs: ["RPL-POL-03:3.4", "ESC-SOP-12:4.13"]

