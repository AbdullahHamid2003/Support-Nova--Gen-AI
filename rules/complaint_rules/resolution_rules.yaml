# =============================================================================
# Complaint Resolution Rule Matrix - resolution rules (RES-*), SRS Step 8 and
# deliverable 5. 116 rules over 35 subcategories.
#
# Selection (per subcategory): rules are evaluated in descending `precedence`.
# The first rule whose conditions are TRUE is selected. Rules whose conditions
# cannot be evaluated because facts are unknown (e.g. no order reference) are
# recorded as "pending verification": any eligibility dimension on which a
# pending rule disagrees with the selected rule becomes `requires_verification`.
# Every subcategory has a default rule (precedence 10, no conditions).
#
# Priority is computed from urgency x impact with rules/complaint_rules/priority_rules.yaml.
# `escalation` records the escalation inherent to the rule (mandatory escalation
# conditions are enforced separately and globally by rules/escalation_rules).
# `timelines` lists the parameters a customer response may quote as timelines.
# `required_actions` entries may be {any_of: [...]} groups.
#
# Facts available to conditions (built deterministically by the fact builder):
#   complaint.*   customer_type, channel, requested_resolution, word_count, has_order_reference,
#                 product_sku, product_line, has_photo_evidence, max_amount,
#                 requested_compensation_amount, max_elapsed_days, outage_hours
#   order.*       exists, delivered, dispatched, shipping_method, order_total, business_days_late,
#                 duplicate_charge_verified, overcharge_verified, return_received,
#                 restocking_fee_applied, return_reason, cancellation_confirmed,
#                 charged_after_cancellation, billing_period, trace_completed, is_hazardous
#   customer.*    is_care_plus
#   eligibility.* within_doa_window, within_defect_window, within_refund_window, within_warranty,
#                 replacement_limit_reached, delay_qualifies, within_dispute_window,
#                 within_cooling_off, refund_late, refund_trace_due, careplus_claims_available
#   history.*     prior_same_issue_count, unresolved_prior_same_issue, references_resolved_complaint
#   case.*        claimed_amount, priority
#   {signal: X} {any_signal: [..]} {text_matches: regex} {subcategory_in: [..]} {category_in: [..]}
# =============================================================================
resolution_rules:
  # ============================ PRODUCT DEFECT ===============================
  - rule_id: RES-PRD-DOA-01
    name: Damaged on arrival - verification pending
    subcategory: PRD-DOA
    precedence: 10
    when: {}
    urgency: Medium
    impact: Medium
    required_actions: [VERIFY_ORDER, REQUEST_PHOTO_EVIDENCE]
    prohibited_actions: [PROMISE_REFUND_BEFORE_VERIFICATION, GUARANTEE_COMPENSATION]
    eligibility: {refund: requires_verification, replacement: requires_verification, compensation: not_applicable}
    escalation: No Escalation
    follow_up: {required: true, type: Request for additional information, due_hours: 24}
    timelines: [doa_report_days, replacement_dispatch_business_days]
    policy_refs: ["RPL-POL-03:3.1"]
  - rule_id: RES-PRD-DOA-02
    name: Damaged on arrival reported within 7 days with evidence
    subcategory: PRD-DOA
    precedence: 30
    when: {all: [{fact: eligibility.within_doa_window, op: eq, value: true}, {fact: complaint.has_photo_evidence, op: eq, value: true}]}
    urgency: Medium
    impact: Medium
    required_actions: [VERIFY_ORDER, {any_of: [SHIP_REPLACEMENT, PROCESS_REFUND]}, ISSUE_RETURN_LABEL]
    prohibited_actions: [GUARANTEE_COMPENSATION]
    eligibility: {refund: eligible, replacement: eligible, compensation: not_applicable}
    escalation: No Escalation
    follow_up: {required: true, type: Replacement-status update, due_hours: 72}
    timelines: [replacement_dispatch_business_days, return_label_business_days, refund_issue_business_days]
    policy_refs: ["RPL-POL-03:3.1", "RPL-POL-03:4.1", "RPL-POL-03:4.2", "REF-POL-02:6.2"]
  - rule_id: RES-PRD-DOA-03
    name: Damage reported after the 7-day window
    subcategory: PRD-DOA
    precedence: 20
    when: {fact: eligibility.within_doa_window, op: eq, value: false}
    urgency: Medium
    impact: Medium
    required_actions: [VERIFY_ORDER]
    recommended_actions: [VERIFY_WARRANTY_STATUS, ESCALATE_SUPERVISOR]
    prohibited_actions: [PROMISE_REFUND_BEFORE_VERIFICATION, GRANT_POLICY_EXCEPTION, SHIP_REPLACEMENT]
    eligibility: {refund: not_eligible, replacement: not_eligible, compensation: not_applicable}
    escalation: No Escalation
    follow_up: {required: true, type: Resolution confirmation, due_hours: 120}
    timelines: [doa_report_days]
    policy_refs: ["RPL-POL-03:3.1", "RPL-POL-03:3.3"]
  - rule_id: RES-PRD-DOA-04
    name: Damaged lithium-battery product - hazardous handling
    subcategory: PRD-DOA
    precedence: 50
    when: {fact: order.is_hazardous, op: eq, value: true}
    urgency: High
    impact: High
    required_actions: [VERIFY_ORDER, ADVISE_STOP_USING, ARRANGE_SPECIALIST_COLLECTION]
    prohibited_actions: [SHIP_DAMAGED_BATTERY_BY_MAIL, ISSUE_RETURN_LABEL, DISMISS_SAFETY_CONCERN]
    eligibility: {refund: requires_verification, replacement: requires_verification, compensation: not_applicable}
    escalation: No Escalation
    follow_up: {required: true, type: Replacement-status update, due_hours: 48}
    timelines: [replacement_dispatch_business_days]
    policy_refs: ["RPL-POL-03:6.1", "SAF-POL-10:5.2"]

