  - rule_id: RES-ACC-LGN-01
    name: Login problem - verified password reset
    subcategory: ACC-LGN
    precedence: 10
    when: {}
    urgency: Medium
    impact: Medium
    required_actions: [VERIFY_IDENTITY, GUIDE_PASSWORD_RESET]
    prohibited_actions: [REQUEST_SENSITIVE_CREDENTIALS]
