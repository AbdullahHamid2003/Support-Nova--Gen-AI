  - rule_id: RES-PRD-MIS-03
    name: Box delivered empty or product missing
    subcategory: PRD-MIS
    precedence: 30
    when: {text_matches: '\b(empty\s+box|box\s+was\s+empty|nothing\s+(was\s+)?inside|device\s+(itself\s+)?(was\s+)?missing)\b'}
    urgency: High
    impact: Medium
    supporting_departments: [DEPT-LOG]
