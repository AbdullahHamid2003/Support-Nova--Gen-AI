    urgency: Low
    impact: Medium
    required_actions: [VERIFY_ORDER, REMOTE_TROUBLESHOOTING, VERIFY_WARRANTY_STATUS]
    prohibited_actions: [PROMISE_REFUND_BEFORE_VERIFICATION, GRANT_POLICY_EXCEPTION, SHIP_REPLACEMENT]
    eligibility: {refund: not_eligible, replacement: not_eligible, compensation: not_applicable}
    escalation: No Escalation
    follow_up: {required: false}
