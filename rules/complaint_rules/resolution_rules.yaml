    policy_refs: ["SEC-POL-09:7.1", "SEC-POL-09:7.2", "SEC-POL-09:6"]
  - rule_id: RES-ACC-LGN-02
    name: Login problem with signs of compromise
    subcategory: ACC-LGN
    precedence: 30
    when: {signal: security_breach}
    urgency: Critical
    impact: High
    required_actions: [VERIFY_IDENTITY, REVIEW_ACCOUNT_ACTIVITY, REVOKE_SESSIONS, FORCE_PASSWORD_RESET]
    prohibited_actions: [REQUEST_SENSITIVE_CREDENTIALS]
    eligibility: {refund: not_applicable, replacement: not_applicable, compensation: not_applicable}
    escalation: Specialist Team
    follow_up: {required: true, type: Escalation acknowledgement, due_hours: 1}
    timelines: [security_response_hours]
    policy_refs: ["SEC-POL-09:4.1", "SEC-POL-09:4.3"]
  - rule_id: RES-ACC-LGN-03
    name: Login blocked by an outdated account email
    subcategory: ACC-LGN
    precedence: 20
    when: {text_matches: '\b(old|previous|former)\s+email\b|\bno\s+longer\s+(have|use)\s+(access\s+to\s+)?(that|the|my)\s+email\b'}
    urgency: Medium
    impact: Medium
    required_actions: [VERIFY_IDENTITY, UPDATE_ACCOUNT_DETAILS, GUIDE_PASSWORD_RESET]
    prohibited_actions: [REQUEST_SENSITIVE_CREDENTIALS]
    eligibility: {refund: not_applicable, replacement: not_applicable, compensation: not_applicable}
    escalation: No Escalation
    follow_up: {required: true, type: Resolution confirmation, due_hours: 48}
    timelines: [account_recovery_business_days]
    policy_refs: ["SEC-POL-09:6", "SEC-POL-09:7.2"]

  - rule_id: RES-ACC-UNA-01
    name: Unauthorized account access - contain and investigate
    subcategory: ACC-UNA
    precedence: 10
    when: {}
    urgency: Critical
    impact: High
    required_actions: [VERIFY_IDENTITY, LOCK_ACCOUNT, REVOKE_SESSIONS, FORCE_PASSWORD_RESET, REVIEW_ACCOUNT_ACTIVITY, ESCALATE_SPECIALIST_TEAM]
    prohibited_actions: [REQUEST_SENSITIVE_CREDENTIALS]
    eligibility: {refund: not_applicable, replacement: not_applicable, compensation: not_applicable}
    escalation: Specialist Team
    follow_up: {required: true, type: Escalation acknowledgement, due_hours: 1}
    timelines: [security_response_hours]
    policy_refs: ["SEC-POL-09:4.1", "SEC-POL-09:4.2", "SEC-POL-09:4.3", "ESC-SOP-12:4.2"]
  - rule_id: RES-ACC-UNA-02
    name: Unauthorized purchases on a compromised account
    subcategory: ACC-UNA
    precedence: 30
    when: {text_matches: '\b(orders?|purchases?|bought|charged)\b.{0,40}\b(did\s+not|didn''t|never)\s+(place|make|order|buy|authori[sz]e)\b|\bunauthori[sz]ed\s+(orders?|purchases?|charges?)\b'}
    urgency: Critical
    impact: High
    supporting_departments: [DEPT-BIL]
    required_actions: [VERIFY_IDENTITY, LOCK_ACCOUNT, REVOKE_SESSIONS, REVIEW_ACCOUNT_ACTIVITY, ESCALATE_SPECIALIST_TEAM]
    recommended_actions: [REVERSE_UNAUTHORIZED_PURCHASES]
    prohibited_actions: [REQUEST_SENSITIVE_CREDENTIALS, PROMISE_REFUND_BEFORE_VERIFICATION]
    eligibility: {refund: requires_verification, replacement: not_applicable, compensation: not_applicable}
    escalation: Specialist Team
    follow_up: {required: true, type: Escalation acknowledgement, due_hours: 1}
    timelines: [security_response_hours]
    policy_refs: ["SEC-POL-09:4.1", "SEC-POL-09:4.4"]
  - rule_id: RES-ACC-UNA-03
    name: Smart-lock security incident
    subcategory: ACC-UNA
    precedence: 40
    when: {signal: lock_security}
    urgency: Critical
    impact: High
    supporting_departments: [DEPT-MGT]
    required_actions: [VERIFY_IDENTITY, ADVISE_PHYSICAL_KEY, REVIEW_ACCOUNT_ACTIVITY, REVOKE_SESSIONS, ESCALATE_CRITICAL_MANAGEMENT]
    prohibited_actions: [REQUEST_SENSITIVE_CREDENTIALS, DISMISS_SAFETY_CONCERN]
    eligibility: {refund: not_applicable, replacement: not_applicable, compensation: not_applicable}
    escalation: Critical Management Escalation
    follow_up: {required: true, type: Escalation acknowledgement, due_hours: 1}
    timelines: [security_response_hours]
    policy_refs: ["SEC-POL-09:5.1", "SEC-POL-09:5.2", "SEC-POL-09:5.3"]

