    follow_up: {required: true, type: Resolution confirmation, due_hours: 240}
    timelines: [warranty_decision_business_days]
    policy_refs: ["RPL-POL-03:3.3", "WAR-POL-07:4.1", "WAR-POL-07:4.2"]
  - rule_id: RES-PRD-MAL-04
    name: Malfunction outside warranty
