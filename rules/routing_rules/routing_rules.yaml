# Signal-driven supporting departments (RTE-RUL-14 s4). Applied on top of the
# routing table; never replace the primary department.
conditional_routing:
  - {rule_id: RTE-101, name: Privacy signal adds Compliance, when: {signal: privacy_breach}, add_supporting: [DEPT-CMP], policy_refs: ["RTE-RUL-14:4.2"]}
  - {rule_id: RTE-102, name: Legal threat adds Compliance, when: {signal: legal_threat}, add_supporting: [DEPT-CMP], policy_refs: ["RTE-RUL-14:4.2"]}
  - {rule_id: RTE-103, name: Security signal adds Account Security, when: {signal: security_breach}, add_supporting: [DEPT-SEC], policy_refs: ["RTE-RUL-14:4.4"]}
  - {rule_id: RTE-104, name: Critical escalation adds Management, when: {escalation_level_at_least: Critical Management Escalation}, add_supporting: [DEPT-MGT], policy_refs: ["RTE-RUL-14:4.3"]}
  - {rule_id: RTE-105, name: Safety signal outside Safety category adds Product Safety, when: {any_signal: [fire_event, overheating, electrical_hazard, injury]}, add_supporting: [DEPT-SAF], policy_refs: ["RTE-RUL-14:4"]}
  - {rule_id: RTE-106, name: Secondary issues add their primary department, when: {secondary_issues: true}, add_supporting: [$secondary_primary_departments], policy_refs: ["RTE-RUL-14:4.1"]}

# Primary-issue precedence when several issues compete (RTE-RUL-14 s5, CHP-POL-01 s3.2)
routing_precedence:
  policy_ref: "RTE-RUL-14:5"
  # LEGAL = legal_threat signal. Root-cause issues (product, delivery, warranty) outrank the refund
  # consequences they cause (e.g. "arrived damaged and the refund has not been processed" -> primary
  # Damaged on Arrival, secondary Refund Delay). Remaining categories share the lowest rank.
  order: [SAF, ACC-UNA, PRV, LEGAL, BIL, PRD, DEL, WAR]
