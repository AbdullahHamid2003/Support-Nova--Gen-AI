    subcategory: REF-REQ
    intended_rule: RES-REF-REQ-03
    difficulty_type: contradictory_policy
    tags: ["outdated_policy:FAQ-BIL-17 v1.0"]
    primary_issue: "Refund requested citing the previous billing FAQ (60 days)"
    order_profile: {name: delivered_old, params: {days: [40, 58]}}
    products: [LUM-VAC-300, LUM-HUB-800]
    customer_types: [individual, vip]
    requested_resolution: refund
    signals: [refund_request, embedded_policy_claim]
    texts:
      - style: polite
        title: "Billing FAQ says 60 days for returns"
        body: >-
          Hello, the Billing and Refunds FAQ (FAQ-BIL-17) I saved says "you can return any item within 60 days for a
          full refund", so according to your policy I am still in time. My {product} arrived on {date:delivered}.
          Could I return it on that basis? Order {order_ref}. Thank you.

