# =============================================================================
# Contradictory / difficult policy cases (SRS 1.8(10) Contradictory Policy Challenge).
# The customer cites an outdated, superseded, draft or conflicting document, an agent's
# out-of-policy promise, or asks for an exception. Expected outcomes always follow the
# ACTIVE policy via the rule matrix (CHP-POL-01 s10: policy > SOP > FAQ; newest effective
# version wins; Superseded/Previous/Draft never primary). Knowledge-base conflicts used:
#   REF-POL-02 v1.0 (Superseded): 60-day refund window, agents approve refunds to 90 days
#   FAQ-BIL-17 v1.0 (Previous):   "return any item within 60 days", "duplicates reversed immediately"
#   FAQ-GEN-16 v5.0 (Active FAQ): "refunds issued within 3 business days" (conflicts with REF-POL-02 4.3)
#   RET-SOP-23 v1.4 (Superseded): agents may issue a USD 50 goodwill credit; batteries by prepaid label
#   DEL-POL-04 v2.0 (Previous):   USD 15 delay credit after 5 business days; lost after 10 business days
#   ESC-SOP-12 v3.2 (Draft):      Supervisor Review after 1 prior unresolved complaint
# =============================================================================
scenarios:
  - scenario_id: CP-REF-60DAY
    pool: dev
    subcategory: REF-REQ
    intended_rule: RES-REF-REQ-03
    difficulty_type: contradictory_policy
    tags: ["outdated_policy:REF-POL-02 v1.0"]
    primary_issue: "Refund requested citing the superseded 60-day refund window"
    order_profile: {name: delivered_old, params: {days: [36, 55]}}
    products: [LUM-SPK-500, LUM-TH-100, LUM-AIR-900, LUM-CAM-210]
    customer_types: [individual, business, vip]
    requested_resolution: refund
    signals: [refund_request, embedded_policy_claim]
    texts:
      - style: calm
        title: "Return within the 60-day window"
        body: >-
          According to your policy I have 60 days to return a product for a refund. My {product} was delivered on
          {date:delivered}, so I am well within that. Please send a return label for order {order_ref}.
      - style: frustrated
        title: "Your refund policy says 60 days"
        body: >-
          Your policy says 60 days for refunds - I have read it. Now your app tells me my {product} is not
          eligible after {age:delivered}. Which is it? I want my refund under the 60-day rule. {order_ref}.
      - style: angry
        title: "Honour your own 60-day policy"
        body: >-
          I have a copy of REF-POL-02 in front of me and section 3.1 says 60 calendar days. You are refusing my
          refund at {age:delivered}. That is a breach of your own rules. Refund order {order_ref} now.

  - scenario_id: CP-REF-FAQ60
