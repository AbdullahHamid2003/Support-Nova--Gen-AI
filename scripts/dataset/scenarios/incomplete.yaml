    primary_issue: "Damage on arrival - no order reference and no photos"
    products: [LUM-SPK-500, LUM-CAM-200]
    requested_resolution: replacement
    signals: [replacement_request]
    expect: {missing_information_include: [order_reference, photo_evidence]}
    texts:
      - style: frustrated
        title: "Cracked on arrival"
        channels: [chat, social_media, mobile_app]
        body: >-
          Just got my {product} and it is cracked down the front. I need a replacement please.

