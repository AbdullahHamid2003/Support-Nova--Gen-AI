    primary_issue: "Vague malfunction report (under 8 words)"
    products: [LUM-TH-100, LUM-HUB-800]
    channels: [web_form, mobile_app]
    requested_resolution: none
    expect: {missing_information_include: [problem_description]}
    texts:
