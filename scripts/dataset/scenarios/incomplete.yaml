# =============================================================================
# Incomplete complaints (SRS 1.8(11) Missing Information Challenge; missing_info_rules MIS-001..008).
# Missing order number, product, date, photos, a vague (< 8 word) description, invalid /
# unknown / malformed order references, and an order that belongs to another customer.
# The expected outcome is a clarification request - never invented facts.
# =============================================================================
scenarios:
  - scenario_id: INC-MAL-NOREF-NODATE
    pool: dev
    subcategory: PRD-MAL
    intended_rule: RES-PRD-MAL-01
    difficulty_type: incomplete
    tags: ["missing:order_reference", "missing:date"]
    primary_issue: "{product} malfunction - no order reference or purchase date"
    products: [LUM-TH-100, LUM-SPK-500, LUM-AIR-900]
    requested_resolution: repair
    expect: {missing_information_include: [order_reference, transaction_date]}
    texts:
      - style: frustrated
        title: "{product} not working"
        body: >-
          My {product} keeps freezing and then restarting by itself. It is really annoying. What can you do about
          it?
      - style: calm
        title: "Faulty {product:short}"
        body: >-
          The {product} I bought from you has stopped responding to the buttons. Could you tell me how to get it
          fixed?

  - scenario_id: INC-DOA-NOPHOTO
    pool: dev
    subcategory: PRD-DOA
    intended_rule: RES-PRD-DOA-01
    difficulty_type: incomplete
    tags: ["missing:photo_evidence"]
    primary_issue: "Damage on arrival reported without photos"
    order_profile: {name: delivered_within_doa, params: {days: [1, 4]}}
    products: [LUM-CAM-210, LUM-HUB-800, LUM-AIR-900]
    requested_resolution: replacement
    signals: [replacement_request]
    expect: {missing_information_include: [photo_evidence]}
    texts:
      - style: calm
        title: "Arrived broken"
        body: >-
          My {product} arrived broken on {date:delivered}. The corner is smashed. Please send a replacement. Order
          {order_ref}.
      - style: angry
        title: "Smashed on arrival"
        body: >-
          Smashed. That is how your {product} arrived. Order {order_ref}. I want a replacement, not a list of
          questions.

  - scenario_id: INC-DOA-NOREF-NOPHOTO
    pool: dev
    subcategory: PRD-DOA
