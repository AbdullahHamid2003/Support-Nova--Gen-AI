    intended_rule: RES-DEL-WRG-02
    difficulty_type: incomplete
    tags: ["missing:photo_evidence"]
    primary_issue: "Wrong item reported without photos"
    order_profile: {name: delivered_recent, params: {days: [1, 5]}}
    products: [LUM-TH-100, LUM-CAM-210]
    product2: [LUM-SPK-500, LUM-BLB-610]
