# =============================================================================
# Repeat, exact-duplicate and near-duplicate complaints (CHP-POL-01 s3.3/3.4/7, ESC-SOP-12 s4.5).
# Each chain is one customer + one order/issue. History facts are computed from the chain:
#   prior_same_issue_count      = earlier chain complaints that are cases (original/repeat)
#   unresolved_prior_same_issue = those whose seed_status is New/In Progress/Escalated/Awaiting Customer
#   references_resolved_complaint = the cited complaint was seeded Resolved/Closed (reopen -> ESC-019)
# Exact/near duplicates are linked to their source (is_duplicate_of / is_near_duplicate_of) and are
# not counted as separate cases. Steps with `pool: holdout` continue a dev chain in the holdout set.
# =============================================================================
scenarios:
  - scenario_id: RPT-INVALID-PREVREF
    pool: dev
    subcategory: SVC-SUP
    intended_rule: RES-SVC-SUP-02
    difficulty_type: repeat
    tags: [invalid_complaint_reference]
    primary_issue: "Follow-up quoting a complaint reference that does not exist"
    requested_resolution: explanation
    include: {product: false}
    signals: [repeat_indicator]
    params: {prev_ref_literal: CMP-99999}
    texts:
      - style: frustrated
        title: "Follow-up on complaint {prev_ref}"
        body: >-
          I am following up on my previous complaint {prev_ref} about my thermostat app. Nobody got back to me and
          the case number does not show in my account. Please pick it up.

chains:
  - scenario_id: RPT-DLY-ESCALATING
    pool: dev
    subcategory: DEL-DLY
    primary_issue: "Late order chased repeatedly"
    order_profile: {name: in_transit_late_standard, params: {bdays_late: [4, 5]}}
    products: [LUM-VAC-300, LUM-AIR-900, LUM-TH-100]
    requested_resolution: explanation
    steps:
      - link: original
        style: calm
        seed_status: In Progress
        intended_rule: RES-DEL-DLY-02
        title: "Order {order_ref} is late"
        body: >-
          My {product} (order {order_ref}) was due on {date:eta} and has not arrived. Could you check with the
          courier please?
      - link: repeat
        gap_days: 3
        style: frustrated
        seed_status: Escalated
        cite_previous: true
        intended_rule: RES-DEL-DLY-02
        title: "Still no delivery - see {prev_ref}"
        body: >-
          Following up on {prev_ref}. My order {order_ref} is still not here and nobody has updated me. This is the
          second time I am asking. Where is it?
      - link: repeat
        gap_days: 10
        style: angry
        cite_previous: true
        intended_rule: RES-DEL-DLY-04
        requested_resolution: replacement
        signals_add: [replacement_request, refund_request]
        title: "THIRD complaint - order {order_ref} still missing"
        body: >-
          This is my third complaint. {prev_ref} and the one before it are still not resolved. My {product} was due
          on {date:eta} - weeks ago. Send a replacement or refund me, I am done waiting.
        lexical_traps: []

  - scenario_id: RPT-DUP-ESCALATING
    pool: dev
    subcategory: BIL-DUP
    primary_issue: "Duplicate charge chased with a resubmission and two follow-ups"
    order_profile: {name: duplicate_charge, params: {days: [3, 8], gap_days: [0, 1]}}
    products: [LUM-TH-100, LUM-CAM-210, LUM-SPK-500]
    requested_resolution: refund
    signals: [refund_request]
    steps:
      - link: original
        style: calm
        seed_status: In Progress
        intended_rule: RES-BIL-DUP-02
        title: "Duplicate charge on {order_ref}"
        body: >-
          I have been charged twice for order {order_ref}, {amt:charge} each time. Please refund the duplicate
          payment.
      - link: exact_duplicate
        gap_days: 1
        of: 0
        intended_rule: RES-BIL-DUP-02
        style: calm
      - link: repeat
        gap_days: 5
        style: frustrated
        seed_status: In Progress
        cite_previous: true
        intended_rule: RES-BIL-DUP-02
        title: "Duplicate charge still not refunded ({prev_ref})"
        body: >-
          I reported a duplicate charge in {prev_ref} and I am still waiting. The second {amt:charge} is still on
          my card. Please refund it.
      - link: repeat
        gap_days: 6
        style: angry
        cite_previous: true
        intended_rule: RES-BIL-DUP-02
        signals_add: [chargeback_threat]
        title: "Second follow-up - duplicate charge"
        body: >-
